<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>KEEPREAL · 训练原型</title>
<style>
  :root{
    --acid:#C7FF3A;
    --acid-2:#D9FF77;
    --acid-soft:rgba(199,255,58,.08);
    --acid-line:rgba(199,255,58,.34);
    --bg:#080A09;
    --bg-deep:#050706;
    --surface:#0E1210;
    --surface-2:#141916;
    --line:#242B27;
    --line-2:#364038;
    --line-3:#4A554D;
    --text:#F1F4EF;
    --sub:#9CA8A0;
    --dim:#65716A;
    --danger:#FF6A4D;
    --font-cn:"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
    --font-display:"Bahnschrift","DIN Alternate","Arial Narrow","PingFang SC","Microsoft YaHei",sans-serif;
    --font-mono:"Consolas","SFMono-Regular","Menlo",monospace;
    --r1:4px; --r2:6px; --r3:8px; --r4:10px; --r5:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font-cn);
    color:var(--text);
    background:
      radial-gradient(900px 600px at 50% -10%,rgba(199,255,58,.055),transparent 62%),
      radial-gradient(700px 500px at 85% 110%,rgba(199,255,58,.025),transparent 60%),
      var(--bg-deep);
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:28px 0;
  }
  ::selection{background:var(--acid);color:#0A0D05}
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--acid);outline-offset:2px}
  .icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .icon--sm{width:14px;height:14px}
  .icon--lg{width:24px;height:24px}

  /* ---------- 桌面舞台 ---------- */
  .stage{display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;z-index:1}
  .stage-note{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;color:#414B44;text-transform:uppercase}
  .phone{
    position:relative;width:390px;height:844px;flex:none;
    background:var(--bg);border-radius:34px;overflow:hidden;isolation:isolate;
    box-shadow:
      0 0 0 1px #242B26,
      0 0 0 9px #0A0D0B,
      0 0 0 10px #1B211D,
      0 40px 110px rgba(0,0,0,.8);
  }
  .phone:after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:120;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);
  }
  #app{position:absolute;inset:0}

  /* ---------- 视图骨架 ---------- */
  .screen{
    position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
    background:
      radial-gradient(120% 70% at 50% -8%,rgba(199,255,58,.05),transparent 58%),
      linear-gradient(180deg,#0A0D0B 0%,#070908 58%);
  }
  .screen__body{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    padding:0 16px calc(22px + env(safe-area-inset-bottom));
    scrollbar-width:none;
  }
  .screen__body::-webkit-scrollbar{display:none}
  .view-anim .screen__body > *{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
  .view-anim .screen__body > *:nth-child(2){animation-delay:.05s}
  .view-anim .screen__body > *:nth-child(3){animation-delay:.1s}
  .view-anim .screen__body > *:nth-child(4){animation-delay:.14s}
  .view-anim .screen__body > *:nth-child(5){animation-delay:.18s}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* ---------- 品牌 ---------- */
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-size:12.5px;font-weight:600;letter-spacing:.2em}
  .brand__mark{
    width:26px;height:26px;border-radius:var(--r1);background:var(--acid);color:#0A0D05;
    display:grid;place-items:center;font-family:var(--font-display);font-size:16px;font-weight:700;line-height:1;letter-spacing:0;
  }
  .brand__sub{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;color:var(--dim);margin-left:-2px}

  /* ---------- 引导 ---------- */
  .ob-head{display:flex;align-items:center;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) 16px 0}
  .ob-progress{display:flex;gap:4px}
  .ob-progress i{display:block;width:22px;height:2px;background:#2B332D;transition:background .2s}
  .ob-progress i.on{background:var(--acid)}
  .ob-body{padding:34px 0 8px}
  .ob-step-num{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;color:var(--dim)}
  .ob-title{font-size:31px;line-height:1.24;font-weight:700;letter-spacing:-.01em;margin-top:12px}
  .ob-title em{font-style:normal;color:var(--acid)}
  .ob-sub{font-size:12.5px;line-height:1.75;color:var(--sub);margin-top:10px}
  .opt-list{display:flex;flex-direction:column;gap:9px;margin-top:26px}
  .opt{
    display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
    padding:15px 14px;border:1px solid var(--line);border-radius:var(--r3);
    background:var(--surface);color:var(--text);cursor:pointer;
    transition:border-color .18s,background .18s,transform .12s;
  }
  .opt:hover{border-color:var(--line-2);background:#111613}
  .opt:active{transform:scale(.994)}
  .opt.is-on{
    border-color:var(--acid-line);
    background:linear-gradient(150deg,rgba(199,255,58,.085),rgba(199,255,58,.015) 60%),var(--surface);
  }
  .opt__icon{
    width:38px;height:38px;flex:none;border:1px solid var(--line-2);border-radius:var(--r2);
    display:grid;place-items:center;color:var(--sub);
  }
  .opt.is-on .opt__icon{color:var(--acid);border-color:var(--acid-line);background:var(--acid-soft)}
  .opt__text{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
  .opt__title{font-size:15px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
  .opt__desc{font-size:11.5px;line-height:1.6;color:var(--dim)}
  .opt__radio{
    width:18px;height:18px;flex:none;border-radius:50%;border:1px solid #3B453E;
    display:grid;place-items:center;margin-top:2px;transition:border-color .18s;
  }
  .opt.is-on .opt__radio{border-color:var(--acid)}
  .opt.is-on .opt__radio:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--acid)}
  .ob-privacy{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);margin-top:22px;line-height:1.6}
  .ob-privacy .icon{width:13px;height:13px}
  .freq-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:26px}
  .freq{
    display:block;text-align:left;padding:16px 14px;border:1px solid var(--line);border-radius:var(--r3);
    background:var(--surface);cursor:pointer;transition:border-color .18s,background .18s,transform .12s;
  }
  .freq:hover{border-color:var(--line-2)}
  .freq:active{transform:scale(.994)}
  .freq.is-on{border-color:var(--acid-line);background:linear-gradient(160deg,rgba(199,255,58,.09),rgba(199,255,58,.01))}
  .freq__n{display:block;font-family:var(--font-display);font-size:40px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
  .freq.is-on .freq__n{color:var(--acid)}
  .freq__n span{font-family:var(--font-cn);font-size:12px;font-weight:400;color:var(--dim);margin-left:3px}
  .freq__label{display:block;font-size:13px;font-weight:600;margin-top:8px}
  .freq__hint{display:block;font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.5}
  .tpl{
    display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--line);
    border-radius:var(--r3);background:var(--surface);cursor:pointer;
    transition:border-color .18s,background .18s,transform .12s;
  }
  .tpl:hover{border-color:var(--line-2)}
  .tpl:active{transform:scale(.996)}
  .tpl.is-on{border-color:var(--acid-line);background:linear-gradient(150deg,rgba(199,255,58,.08),rgba(199,255,58,.012) 65%)}
  .tpl__row{display:flex;align-items:center;gap:8px}
  .tpl__name{font-size:15px;font-weight:700}
  .tpl__badge{
    font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;color:var(--acid);
    border:1px solid var(--acid-line);border-radius:3px;padding:2px 5px;
  }
  .tpl__row .opt__radio{margin-left:auto;margin-top:0}
  .tpl__sub{display:block;font-size:11.5px;color:var(--sub);margin-top:5px;line-height:1.55}
  .tpl__meta{display:flex;align-items:center;gap:12px;margin-top:10px;font-family:var(--font-mono);font-size:10px;color:var(--dim);letter-spacing:.02em}
  .tpl__meta span{display:inline-flex;align-items:center;gap:5px}
  .tpl__meta span+span:before{content:"";width:1px;height:9px;background:var(--line-2);margin-right:7px}
  .tpl__tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .tag{
    display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px;border-radius:3px;
    font-size:9.5px;letter-spacing:.05em;color:var(--dim);border:1px solid var(--line);background:rgba(255,255,255,.015);
  }
  .tag--acid{color:var(--acid);border-color:var(--acid-line);background:var(--acid-soft);font-weight:600}
  .tag--quiet{color:var(--dim);border-color:var(--line);background:transparent}
  .ob-foot{
    display:flex;gap:9px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:rgba(8,10,9,.86);backdrop-filter:blur(10px);
  }
  .icon-btn{
    width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:var(--r2);
    border:1px solid var(--line-2);background:transparent;color:var(--text);cursor:pointer;
    transition:border-color .18s,background .18s;
  }
  .icon-btn:hover{border-color:var(--line-3);background:rgba(255,255,255,.03)}
  .icon-btn:active{transform:translateY(1px)}

  /* ---------- 通用按钮 ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    height:52px;width:100%;border:0;border-radius:var(--r2);
    font-size:15px;font-weight:700;letter-spacing:.02em;cursor:pointer;
    transition:background .18s,border-color .18s,transform .12s,opacity .18s;
  }
  .btn .icon{width:18px;height:18px}
  .btn--primary{background:var(--acid);color:#0A0D05}
  .btn--primary:hover{background:var(--acid-2)}
  .btn--primary:active{transform:translateY(1px)}
  .btn--ghost{background:transparent;border:1px solid var(--line-2);color:var(--text)}
  .btn--ghost:hover{border-color:var(--line-3);background:rgba(255,255,255,.03)}
  .btn--danger{background:rgba(255,106,77,.09);border:1px solid rgba(255,106,77,.4);color:#FF8F7B}
  .btn--danger:hover{background:rgba(255,106,77,.16)}
  .btn[disabled]{opacity:.32;pointer-events:none}
  .btn--primary[disabled]{opacity:1;background:#191F1A;color:#5E6A61;border:1px solid #2A312C}
  .btn--sm{height:42px;font-size:13px}
  .text-btn{background:none;border:0;color:var(--sub);font-size:12px;padding:8px 2px;cursor:pointer}
  .text-btn:hover{color:var(--text)}

  /* ---------- 今天 ---------- */
  .home-head{padding:calc(20px + env(safe-area-inset-top)) 0 0}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .plan-pill{
    display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.04em;color:var(--sub);
    border:1px solid var(--line-2);border-radius:var(--r1);padding:5px 7px;white-space:nowrap;
  }
  .plan-pill i{width:4px;height:4px;border-radius:50%;background:var(--acid);display:block}
  .home-date{display:flex;align-items:baseline;gap:8px;margin-top:26px}
  .home-date .eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;color:var(--acid)}
  .home-date span{font-size:11px;color:var(--dim)}
  .home-title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:4px}
  .home-title{font-family:var(--font-display);font-size:46px;line-height:1;font-weight:600;letter-spacing:-.01em}
  .home-day-idx{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--dim);padding-bottom:6px}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:18px}
  .day{
    position:relative;background:#0C100E;border:1px solid var(--line);border-radius:var(--r2);
    padding:8px 0 7px;text-align:center;cursor:pointer;
    transition:border-color .18s,background .18s,transform .12s;
  }
  .day:hover{border-color:var(--line-2)}
  .day:active{transform:scale(.97)}
  .day.is-sel{border-color:var(--acid);background:rgba(199,255,58,.06)}
  .day__dow{font-size:9.5px;color:#7A867D;letter-spacing:.04em}
  .day__num{font-family:var(--font-display);font-size:15.5px;font-weight:600;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
  .day.is-sel .day__num{color:var(--acid)}
  .day__dot{display:block;width:4px;height:4px;border-radius:50%;background:var(--acid);margin:5px auto 0}
  .day__dot.is-rest{background:transparent;border:1px solid #414B44}
  .day__dot.is-done{width:8px;height:2px;border-radius:1px;background:var(--text)}

  /* ---------- 今日卡片 ---------- */
  .hero{
    position:relative;margin-top:16px;padding:18px 16px 16px;overflow:hidden;
    border:1px solid var(--line);border-radius:var(--r4);
    background:linear-gradient(158deg,#161C17 0%,#0D110F 62%);
  }
  .hero:before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(115deg,rgba(255,255,255,.022) 0 1px,transparent 1px 10px);
    -webkit-mask-image:linear-gradient(200deg,#000 0%,transparent 42%);
    mask-image:linear-gradient(200deg,#000 0%,transparent 42%);
  }
  .hero__corner{position:absolute;top:9px;left:9px;width:16px;height:16px;border-top:1px solid var(--acid);border-left:1px solid var(--acid);opacity:.45}
  .hero__corner--br{top:auto;left:auto;right:9px;bottom:9px;border-top:0;border-left:0;border-right:1px solid var(--acid);border-bottom:1px solid var(--acid)}
  .hero__top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .hero__day{font-family:var(--font-mono);font-size:10px;color:var(--dim);letter-spacing:.06em}
  .hero__name{position:relative;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em;margin-top:16px}
  .hero__focus{position:relative;font-size:11.5px;line-height:1.65;color:var(--dim);margin-top:5px;max-width:270px}
  .stat-row{position:relative;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:16px 0 14px}
  .stat{padding:11px 0 11px 12px;display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--line)}
  .stat:first-child{border-left:0;padding-left:0}
  .stat__num{font-family:var(--font-display);font-size:27px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:3px}
  .stat__num small{font-family:var(--font-cn);font-size:10px;font-weight:400;color:var(--dim)}
  .stat__label{font-size:9.5px;letter-spacing:.06em;color:var(--dim)}
  .hero__hint{position:relative;font-size:10px;line-height:1.5;color:var(--dim);text-align:center;margin-top:10px}
  .hero__hint--left{text-align:left;margin-top:12px}
  .hero--done .tag{color:var(--sub)}
  .hero--rest .hero__name{margin-top:10px}
  .rest-icon{
    width:46px;height:46px;border:1px solid var(--line-2);border-radius:50%;display:grid;place-items:center;
    color:var(--acid);margin:18px 0 4px;background:var(--acid-soft);
  }
  .next-box{
    position:relative;margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:var(--r2);
    background:#0A0D0B;
  }
  .next-box__label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;color:var(--acid)}
  .next-box__row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:7px}
  .next-box__row span{font-size:11px;color:var(--dim)}
  .next-box__row b{font-size:14px}
  .next-box__meta{font-size:10.5px;color:var(--dim);margin-top:4px}
  .live-bar{height:3px;background:#232A25;border-radius:2px;overflow:hidden;margin:16px 0 8px}
  .live-bar i{display:block;height:100%;background:var(--acid);transition:width .3s ease}
  .live-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-bottom:14px}
  .live-meta b{color:var(--text);font-family:var(--font-mono);font-weight:600}
  .hero .btn{margin-top:2px}

  /* ---------- 计划概览 ---------- */
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 4px}
  .section-head h2{font-size:12px;font-weight:700;letter-spacing:.08em}
  .section-head span{font-family:var(--font-mono);font-size:10px;color:var(--dim);letter-spacing:.04em}
  .plan-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
  .plan-row:last-child{border-bottom:0}
  .plan-row__idx{font-family:var(--font-mono);font-size:10.5px;color:var(--dim);width:20px;flex:none}
  .plan-row > span:nth-child(2){flex:1;min-width:0}
  .plan-row.is-today .plan-row__idx{color:var(--acid)}
  .plan-row__name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .plan-row.is-today .plan-row__name:after{content:"今天";font-size:8.5px;font-weight:600;color:var(--acid);border:1px solid var(--acid-line);border-radius:2px;padding:1px 4px;letter-spacing:.04em}
  .plan-row__sub{display:block;font-size:10.5px;color:var(--dim);margin-top:3px}
  .plan-row__meta{font-family:var(--font-mono);font-size:10px;color:var(--sub);margin-left:auto;text-align:right;white-space:nowrap}
  .home-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:10px;color:var(--dim)}
  .home-foot span{display:inline-flex;align-items:center;gap:5px}
  .home-foot .icon{width:12px;height:12px}
  .link-btn{background:none;border:0;color:#4E5A52;font-family:inherit;font-size:10px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
  .link-btn:hover{color:var(--sub)}

  /* ---------- 训练执行 ---------- */
  .wk-head{display:flex;align-items:center;gap:10px;padding:calc(16px + env(safe-area-inset-top)) 16px 10px}
  .wk-head .icon-btn{width:38px;height:38px;border-color:var(--line)}
  .wk-head__mid{flex:1;min-width:0;text-align:center}
  .wk-head__name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wk-head__meta{font-family:var(--font-mono);font-size:10px;color:var(--dim);letter-spacing:.06em;margin-top:3px;white-space:nowrap}
  .wk-head__meta b{color:var(--acid);font-weight:600}
  .wk-head .text-btn{width:38px;text-align:right;flex:none}
  .progress{height:2px;background:#1D2320;margin:0 16px;border-radius:2px;overflow:hidden;flex:none}
  .progress i{display:block;height:100%;background:var(--acid);transition:width .3s ease}
  .ex-pager{display:flex;gap:5px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
  .ex-pager::-webkit-scrollbar{display:none}
  .ex-chip{
    flex:none;height:28px;min-width:30px;padding:0 8px;display:flex;align-items:center;justify-content:center;gap:5px;
    border:1px solid var(--line);background:#0C100E;color:var(--dim);border-radius:var(--r1);
    font-family:var(--font-mono);font-size:10.5px;cursor:pointer;transition:border-color .16s,color .16s,background .16s;
  }
  .ex-chip:hover{border-color:var(--line-2);color:var(--sub)}
  .ex-chip.is-on{border-color:var(--acid);color:var(--acid);background:var(--acid-soft)}
  .ex-chip.is-complete{color:var(--sub)}
  .ex-chip__dot{width:3px;height:3px;border-radius:50%;background:var(--acid);display:none}
  .ex-chip.is-complete .ex-chip__dot{display:block}
  .ex-head{margin-top:16px}
  .ex-kicker{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--dim)}
  .ex-name{font-size:33px;line-height:1.16;font-weight:700;letter-spacing:-.015em;margin-top:7px}
  .ex-sub{font-size:11.5px;color:var(--sub);margin-top:6px;display:flex;align-items:center;gap:7px}
  .ex-sub .sep{width:2px;height:2px;border-radius:50%;background:#4A554D}
  .ex-facts{display:flex;margin-top:14px;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:#0B0F0C}
  .ex-fact{flex:1;padding:8px 0;text-align:center;border-left:1px solid var(--line);font-size:9.5px;color:var(--dim);letter-spacing:.04em}
  .ex-fact:first-child{border-left:0}
  .ex-fact b{display:block;font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--text);margin-bottom:1px;font-variant-numeric:tabular-nums}
  .cue{font-size:11.5px;line-height:1.75;color:var(--dim);border-left:2px solid #2C342E;padding:1px 0 1px 10px;margin-top:14px}
  .prev-bar{
    display:flex;align-items:center;gap:8px;margin-top:14px;padding:8px 10px;
    border:1px solid var(--line);border-radius:var(--r1);background:#0B0F0C;font-size:10px;color:var(--dim);flex-wrap:wrap;
  }
  .prev-bar b{font-family:var(--font-mono);font-size:10.5px;font-weight:500;color:var(--sub);letter-spacing:.01em}
  .calc{margin-top:9px}
  .calc__toggle{
    display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
    padding:10px;border:1px dashed #2E3731;border-radius:var(--r1);background:transparent;
    color:var(--sub);font-family:inherit;font-size:11.5px;cursor:pointer;transition:border-color .18s,color .18s;
  }
  .calc__toggle:hover{border-color:#4A554D;color:var(--text)}
  .calc__toggle span{display:flex;align-items:center;gap:7px}
  .calc__toggle .icon{width:14px;height:14px}
  .calc__chev{transition:transform .2s}
  .calc__chev.is-open{transform:rotate(180deg)}
  .calc__panel{margin-top:7px;padding:12px;border:1px solid var(--line);border-radius:var(--r2);background:#0A0E0B;animation:fadeIn .18s ease}
  .plate-vis{
    display:flex;align-items:center;justify-content:center;gap:3px;height:74px;
    background:repeating-linear-gradient(90deg,transparent 0 23px,rgba(255,255,255,.025) 23px 24px);
    border-radius:var(--r1);overflow:hidden;
  }
  .plate-stack{display:flex;align-items:center;gap:2px}
  .plate{width:9px;border-radius:2px;background:#2A322C;border:1px solid #404B43}
  .plate--acid{border-color:var(--acid);background:#243018}
  .bar-rod{width:52px;height:4px;background:#3B463E;border-radius:2px}
  .collar{width:4px;height:12px;background:#4A554D;border-radius:1px}
  .calc__rows{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .calc__row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:10.5px;color:var(--dim)}
  .calc__row b{font-family:var(--font-mono);font-size:11px;color:var(--sub);font-weight:500}
  .calc__row.is-warn b{color:var(--danger)}
  .calc__note{font-family:var(--font-mono);font-size:9.5px;color:#4E5A52;margin-top:2px;letter-spacing:.02em}
  .set-table{margin-top:16px}
  .set-table__head{
    display:grid;grid-template-columns:26px 1fr 1fr 54px 34px;gap:7px;padding:0 6px 6px;
    font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;color:#525E56;text-align:center;
  }
  .set-table__head span:nth-child(1){text-align:left}
  .set-row{
    display:grid;grid-template-columns:26px 1fr 1fr 54px 34px;gap:7px;align-items:center;
    padding:6px;margin-bottom:5px;border:1px solid var(--line);border-radius:var(--r2);
    background:#0B0F0C;transition:border-color .16s,background .16s;
  }
  .set-row.is-next{border-color:#3D4940}
  .set-row.is-done{border-color:rgba(199,255,58,.38);background:rgba(199,255,58,.045)}
  .set-idx{font-family:var(--font-mono);font-size:11.5px;color:var(--dim);text-align:center}
  .set-row.is-done .set-idx{color:var(--acid)}
  .set-input{
    width:100%;height:40px;background:#070A08;border:1px solid #29312B;border-radius:var(--r1);
    color:var(--text);font-family:var(--font-mono);font-size:16px;font-weight:600;text-align:center;
    font-variant-numeric:tabular-nums;transition:border-color .16s,box-shadow .16s,color .16s;
    -moz-appearance:textfield;
  }
  .set-input::-webkit-outer-spin-button,.set-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .set-input:focus{outline:none;border-color:var(--acid);box-shadow:0 0 0 2px rgba(199,255,58,.14)}
  .set-row.is-done .set-input{color:var(--acid);border-color:#364331}
  .set-prev{font-family:var(--font-mono);font-size:9.5px;line-height:1.35;color:#58645C;text-align:center;letter-spacing:-.02em}
  .set-check{
    width:34px;height:34px;display:grid;place-items:center;border:1px solid #364038;border-radius:var(--r1);
    background:#080B09;color:#4F5B52;cursor:pointer;transition:all .16s;
  }
  .set-check .icon{width:16px;height:16px;stroke-width:2.2}
  .set-check:hover{border-color:#5A6860;color:var(--sub)}
  .set-row.is-done .set-check{background:var(--acid);border-color:var(--acid);color:#0A0D05}
  .set-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
  .mini-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 10px;
    border:1px solid var(--line-2);border-radius:var(--r1);background:transparent;color:var(--sub);
    font-family:inherit;font-size:11px;cursor:pointer;transition:border-color .16s,color .16s,background .16s;
  }
  .mini-btn:hover{color:var(--text);border-color:var(--line-3);background:rgba(255,255,255,.03)}
  .mini-btn .icon{width:13px;height:13px}
  .tool-hint{font-size:9.5px;line-height:1.5;color:#525E56;text-align:right}
  .wk-foot{
    display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:rgba(8,10,9,.9);backdrop-filter:blur(10px);
  }
  .wk-foot .btn{height:50px;font-size:14px}
  .wk-foot .btn--ghost{width:94px;flex:none;font-size:12px}

  /* ---------- 休息浮层 ---------- */
  .rest{
    position:absolute;left:0;right:0;bottom:0;z-index:50;
    padding:15px 16px calc(15px + env(safe-area-inset-bottom));
    background:#111613;border-top:1px solid var(--acid-line);border-radius:var(--r5) var(--r5) 0 0;
    box-shadow:0 -26px 56px rgba(0,0,0,.65);
    animation:sheetUp .28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
  .rest__top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .rest__label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;color:var(--acid);display:flex;align-items:center;gap:6px}
  .rest__label .icon{width:13px;height:13px}
  .rest__next{font-size:10px;color:var(--dim);text-align:right;line-height:1.4;max-width:60%}
  .rest__mid{display:flex;align-items:baseline;gap:8px;margin:6px 0 9px}
  .rest__time{font-family:var(--font-display);font-size:50px;line-height:1;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
  .rest__unit{font-size:10px;color:var(--dim)}
  .rest__bar{height:3px;background:#232A25;border-radius:2px;overflow:hidden}
  .rest__bar i{display:block;height:100%;background:var(--acid);transition:width .22s linear}
  .rest__actions{display:flex;align-items:center;gap:7px;margin-top:13px}
  .rest__actions .mini-btn{flex:1;height:38px}
  .rest__skip{
    flex:none;background:none;border:0;color:var(--sub);font-family:inherit;font-size:11px;cursor:pointer;
    padding:8px 6px;text-decoration:underline;text-underline-offset:3px;
  }
  .rest__skip:hover{color:var(--text)}

  /* ---------- 汇总 ---------- */
  .sum-hero{padding-top:calc(26px + env(safe-area-inset-top))}
  .sum-check{
    width:50px;height:50px;border-radius:50%;background:var(--acid);color:#0A0D05;
    display:grid;place-items:center;margin-bottom:18px;box-shadow:0 0 0 6px rgba(199,255,58,.08);
  }
  .sum-check .icon{width:24px;height:24px;stroke-width:2.4}
  .sum-date{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--acid)}
  .sum-title{font-size:38px;line-height:1.12;font-weight:700;letter-spacing:-.015em;margin-top:7px}
  .volume-card{
    position:relative;margin-top:20px;padding:16px;border:1px solid var(--line);border-radius:var(--r3);
    background:linear-gradient(158deg,#151B16,#0C100D 70%);overflow:hidden;
  }
  .volume-card:after{
    content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;
    border-radius:50%;border:1px solid rgba(199,255,58,.12);
  }
  .volume-label{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;color:var(--dim)}
  .volume-num{
    font-family:var(--font-display);font-size:58px;line-height:1;font-weight:600;color:var(--acid);
    margin-top:7px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;display:flex;align-items:baseline;gap:5px;
  }
  .volume-num small{font-family:var(--font-cn);font-size:12px;font-weight:400;color:var(--dim);letter-spacing:0}
  .volume-sub{font-family:var(--font-mono);font-size:9.5px;color:var(--dim);margin-top:9px;letter-spacing:.02em}
  .stat2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
  .stat2 > div{padding:12px;border:1px solid var(--line);border-radius:var(--r2);background:#0C100E}
  .stat2 span{font-size:9.5px;color:var(--dim);letter-spacing:.06em}
  .stat2 b{display:block;font-family:var(--font-display);font-size:21px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
  .pr-card{
    display:flex;align-items:center;gap:11px;padding:11px 12px;margin-bottom:6px;
    border:1px solid rgba(199,255,58,.28);border-radius:var(--r2);background:rgba(199,255,58,.05);
  }
  .pr-card__icon{width:32px;height:32px;flex:none;border-radius:var(--r1);border:1px solid var(--acid-line);display:grid;place-items:center;color:var(--acid);background:rgba(199,255,58,.06)}
  .pr-card__icon .icon{width:15px;height:15px}
  .pr-name{font-size:12.5px;font-weight:600}
  .pr-val{font-family:var(--font-mono);font-size:10px;color:var(--sub);margin-top:2px;letter-spacing:.01em}
  .pr-val s{color:#5A665E}
  .pr-delta{
    margin-left:auto;flex:none;font-family:var(--font-mono);font-size:10px;font-weight:700;
    color:#0A0D05;background:var(--acid);border-radius:3px;padding:3px 5px;
  }
  .note-box{border:1px solid var(--line);border-radius:var(--r2);padding:13px;background:#0C100E;font-size:11.5px;line-height:1.7;color:var(--dim)}
  .bd-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .bd-row:last-child{border-bottom:0}
  .bd-name{font-size:12.5px;font-weight:600}
  .bd-sub{font-family:var(--font-mono);font-size:9.5px;color:var(--dim);margin-top:3px}
  .bd-vol{font-family:var(--font-mono);font-size:10.5px;color:var(--sub);margin-left:auto;white-space:nowrap}
  .bd-row.is-zero .bd-name,.bd-row.is-zero .bd-vol{color:#4E5A52}
  .sum-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(8,10,9,.9);backdrop-filter:blur(10px)}

  /* ---------- 生成中 ---------- */
  .gen{
    position:absolute;inset:0;z-index:85;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:32px;text-align:center;background:#070908;
  }
  .gen[hidden]{display:none}
  .gen__ring{width:60px;height:60px;border-radius:50%;border:1.5px solid #2A312C;border-top-color:var(--acid);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .gen__title{font-size:17px;font-weight:700;margin-top:6px}
  .gen__msg{font-family:var(--font-mono);font-size:10.5px;color:var(--dim);letter-spacing:.02em;min-height:16px}
  .gen__brand{position:absolute;bottom:34px;font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;color:#3E4841}

  /* ---------- Toast / Modal ---------- */
  #toast-root{position:absolute;top:0;left:0;right:0;z-index:110;padding:calc(66px + env(safe-area-inset-top)) 16px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .toast{
    background:#161C17;border:1px solid var(--line-2);border-left:2px solid var(--acid);border-radius:var(--r1);
    padding:10px 12px;font-size:11.5px;line-height:1.5;color:var(--text);
    box-shadow:0 14px 34px rgba(0,0,0,.55);animation:toastIn .24s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(-8px)}}
  #modal-root{position:absolute;inset:0;z-index:100;display:none}
  #modal-root.is-open{display:block}
  .modal-backdrop{position:absolute;inset:0;background:rgba(3,5,4,.68);backdrop-filter:blur(5px);animation:fadeIn .2s ease}
  .modal{
    position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);
    background:#121713;border:1px solid var(--line-2);border-radius:var(--r4);padding:20px;
    animation:modalIn .24s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 70px rgba(0,0,0,.6);
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(-46%) scale(.97)}}
  .modal h3{font-size:17px;font-weight:700}
  .modal p{font-size:11.5px;line-height:1.75;color:var(--sub);margin-top:8px}
  .modal-actions{display:flex;gap:8px;margin-top:18px}
  .modal-actions .btn{height:44px;font-size:12.5px}

  @media (prefers-reduced-motion:reduce){
    *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
  @media (max-width:560px){
    body{display:block;padding:0;background:var(--bg)}
    .stage{gap:0;display:block}
    .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
    .phone:after{display:none}
    .stage-note{display:none}
  }
  @media (max-height:900px) and (min-width:561px){
    body{padding:14px 0}
    .phone{height:calc(100dvh - 76px);max-height:844px}
  }

/* ============================================================
     第二批：底部导航 / 计划 / 动作库 / 进步 / 身体 / 我的
     ============================================================ */

  .screen--tab .screen__body{padding-bottom:calc(94px + env(safe-area-inset-bottom))}
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;z-index:60;
    display:grid;grid-template-columns:repeat(5,1fr);
    padding:6px 6px calc(5px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(8,10,9,.55),rgba(8,10,9,.96) 34%);
    border-top:1px solid var(--line);backdrop-filter:blur(16px);
  }
  .tabbar__item{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:7px 0 3px;background:none;border:0;color:#6B776F;
    font-family:inherit;font-size:9.5px;letter-spacing:.04em;cursor:pointer;
    transition:color .16s;
  }
  .tabbar__item .icon{width:19px;height:19px;transition:transform .16s}
  .tabbar__item:hover{color:var(--sub)}
  .tabbar__item.is-on{color:var(--acid)}
  .tabbar__item.is-on .icon{transform:translateY(-1px)}
  .tabbar__item.is-on:after{
    content:"";position:absolute;bottom:-5px;width:14px;height:2px;border-radius:1px;background:var(--acid);
  }

  /* ---------- 页面通用 ---------- */
  .pg{padding-top:calc(24px + env(safe-area-inset-top))}
  .pg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .pg-eyebrow{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.18em;color:var(--acid)}
  .pg-title{font-family:var(--font-display);font-size:38px;line-height:1;font-weight:600;letter-spacing:-.01em;margin-top:7px}
  .pg-sub{font-size:11.5px;line-height:1.65;color:var(--dim);margin-top:9px;max-width:270px}
  .pg-tools{display:flex;gap:6px;flex:none}
  .pg-tool{
    display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 9px;
    border:1px solid var(--line-2);border-radius:var(--r1);background:transparent;color:var(--sub);
    font-family:inherit;font-size:10.5px;cursor:pointer;white-space:nowrap;
  }
  .pg-tool:hover{color:var(--text);border-color:var(--line-3);background:rgba(255,255,255,.03)}
  .pg-tool .icon{width:13px;height:13px}

  .sub-head{display:flex;align-items:center;gap:10px;padding:calc(16px + env(safe-area-inset-top)) 16px 10px;flex:none}
  .sub-head .icon-btn{width:36px;height:36px;border-color:var(--line)}
  .sub-head__mid{flex:1;min-width:0;text-align:center}
  .sub-head__name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub-head__meta{font-family:var(--font-mono);font-size:9.5px;color:var(--dim);letter-spacing:.04em;margin-top:2px}
  .sub-head .text-btn{flex:none;min-width:36px;text-align:right;color:var(--acid)}

  .panel{
    border:1px solid var(--line);border-radius:var(--r3);padding:14px;
    background:linear-gradient(160deg,#121713 0%,#0B0F0C 74%);
  }
  .panel + .panel{margin-top:8px}
  .panel__label{font-family:var(--font-mono);font-size:9px;letter-spacing:.15em;color:var(--dim)}
  .panel__title{font-size:14px;font-weight:700;margin-top:5px}
  .panel__sub{font-size:11px;line-height:1.6;color:var(--dim);margin-top:5px}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .stat-grid > div{border:1px solid var(--line);border-radius:var(--r2);background:#0C100E;padding:10px}
  .stat-grid span{font-size:9.5px;color:var(--dim);letter-spacing:.04em}
  .stat-grid b{display:block;font-family:var(--font-display);font-size:21px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1}
  .stat-grid b small{font-family:var(--font-cn);font-size:9.5px;font-weight:400;color:var(--dim);margin-left:2px}

  .seg{display:flex;gap:2px;border:1px solid var(--line);border-radius:var(--r1);background:#0A0E0B;padding:2px}
  .seg button{
    flex:1;height:29px;border:0;border-radius:3px;background:transparent;color:var(--dim);
    font-family:inherit;font-size:11px;cursor:pointer;transition:background .16s,color .16s;
  }
  .seg button.is-on{background:var(--acid);color:#0A0D05;font-weight:700}
  .seg--ghost button.is-on{background:#28312A;color:var(--acid)}

  .chips{display:flex;gap:5px;overflow-x:auto;padding:1px 0;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;height:28px;padding:0 9px;border:1px solid var(--line);border-radius:var(--r1);
    background:#0C100E;color:var(--sub);font-family:inherit;font-size:10.5px;cursor:pointer;
    transition:border-color .16s,color .16s,background .16s;white-space:nowrap;
  }
  .chip:hover{border-color:var(--line-2);color:var(--text)}
  .chip.is-on{border-color:var(--acid);color:var(--acid);background:var(--acid-soft)}

  .search{position:relative;margin-top:14px}
  .search .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--dim)}
  .search input{
    width:100%;height:42px;background:#0B0F0C;border:1px solid var(--line);border-radius:var(--r2);
    padding:0 12px 0 35px;color:var(--text);font-family:inherit;font-size:12.5px;
    transition:border-color .16s,box-shadow .16s;
  }
  .search input::placeholder{color:#4F5B52}
  .search input:focus{outline:none;border-color:var(--acid);box-shadow:0 0 0 2px rgba(199,255,58,.12)}
  .filter-row{display:flex;flex-direction:column;gap:6px;margin-top:10px}

  .empty{
    padding:24px 18px;text-align:center;border:1px dashed #2C352E;border-radius:var(--r2);
    color:var(--dim);font-size:11px;line-height:1.8;background:rgba(255,255,255,.008);
  }
  .empty b{display:block;color:var(--sub);font-size:12px;margin-bottom:4px}
  .empty .btn{margin-top:12px}

  /* ---------- 计划 ---------- */
  .plan-hero{
    position:relative;margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:var(--r4);overflow:hidden;
    background:linear-gradient(152deg,#171E18 0%,#0C100D 72%);
  }
  .plan-hero:after{
    content:"";position:absolute;right:-36px;top:-42px;width:150px;height:150px;border-radius:50%;
    border:1px solid rgba(199,255,58,.12);
  }
  .plan-hero__top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .plan-hero__name{position:relative;font-size:24px;font-weight:700;line-height:1.2;margin-top:12px}
  .plan-hero__meta{position:relative;font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-top:6px;letter-spacing:.02em}
  .plan-hero__stats{position:relative;display:flex;gap:0;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .plan-hero__stat{flex:1;border-left:1px solid var(--line);padding-left:12px}
  .plan-hero__stat:first-child{border-left:0;padding-left:0}
  .plan-hero__stat b{display:block;font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1}
  .plan-hero__stat span{font-size:9.5px;color:var(--dim)}
  .plan-hero__actions{position:relative;display:flex;gap:6px;margin-top:14px}
  .plan-hero__actions .mini-btn{flex:1;height:34px}

  .day-row{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 0;
    border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font-family:inherit;cursor:pointer;
  }
  .day-row:last-child{border-bottom:0}
  .day-row:hover .day-row__name{color:var(--acid)}
  .day-row__idx{font-family:var(--font-mono);font-size:10.5px;color:var(--dim);width:22px;flex:none}
  .day-row__main{flex:1;min-width:0}
  .day-row__name{font-size:13.5px;font-weight:600;transition:color .16s}
  .day-row__sub{display:block;font-size:10.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day-row__meta{flex:none;text-align:right;font-family:var(--font-mono);font-size:9.5px;color:var(--sub);line-height:1.5}
  .day-row .icon{width:13px;height:13px;color:#4E5A52;flex:none}
  .tool-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  .tool-card{
    display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r2);
    background:#0C100E;color:inherit;font-family:inherit;text-align:left;cursor:pointer;transition:border-color .16s,background .16s;
  }
  .tool-card:hover{border-color:var(--line-2);background:#111613}
  .tool-card .icon{width:17px;height:17px;color:var(--acid);flex:none}
  .tool-card b{display:block;font-size:12px}
  .tool-card span{display:block;font-size:9.5px;color:var(--dim);margin-top:2px}

  .day-tabs{display:flex;gap:5px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
  .day-tabs::-webkit-scrollbar{display:none}
  .day-tab{
    flex:none;height:32px;padding:0 11px;display:flex;align-items:center;gap:6px;
    border:1px solid var(--line);border-radius:var(--r1);background:#0C100E;color:var(--sub);
    font-family:inherit;font-size:11px;cursor:pointer;
  }
  .day-tab b{font-family:var(--font-mono);font-size:9px;color:var(--dim);font-weight:400}
  .day-tab.is-on{border-color:var(--acid);color:var(--acid);background:var(--acid-soft)}
  .day-tab.is-on b{color:var(--acid);opacity:.6}

  .ex-line{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .ex-line:last-child{border-bottom:0}
  .ex-line__idx{font-family:var(--font-mono);font-size:10px;color:var(--dim);width:18px;flex:none;padding-top:2px}
  .ex-line__main{flex:1;min-width:0}
  .ex-line__name{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ex-line__sub{font-size:9.5px;color:var(--dim);margin-top:3px;line-height:1.45}
  .ex-line__right{flex:none;text-align:right;font-family:var(--font-mono);font-size:10px;color:var(--sub);line-height:1.5}
  .ex-line__right s{display:block;color:#4E5A52;font-size:9px;text-decoration:none}
  .ex-line__tools{flex:none;display:flex;gap:4px;align-items:center}
  /* 计划编辑：按住序号拖动排序 */
  .ex-edit-list.is-sorting{user-select:none}
  .ex-line--edit{position:relative;transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s,background .16s}
  .ex-line--edit .ex-line__idx--handle{
    width:26px;margin-left:-4px;align-self:stretch;display:flex;align-items:flex-start;justify-content:center;
    padding-top:12px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  .ex-line--edit .ex-line__idx--handle:active{cursor:grabbing}
  .ex-line--edit.is-dragging{
    transition:none;z-index:6;border-radius:var(--r2);border-bottom-color:transparent;
    background:#141A16;box-shadow:0 14px 30px rgba(0,0,0,.6),0 0 0 1px var(--acid-line);
  }
  .ex-line--edit.is-dragging .ex-line__idx--handle{cursor:grabbing;color:var(--acid)}
  body.is-drag-sorting{user-select:none;-webkit-user-select:none;cursor:grabbing}
  .mini-tag{
    display:inline-flex;align-items:center;height:16px;padding:0 4px;border-radius:2px;
    font-family:var(--font-mono);font-size:8px;letter-spacing:.04em;color:var(--dim);
    border:1px solid var(--line);background:rgba(255,255,255,.015);
  }
  .mini-tag--acid{color:var(--acid);border-color:var(--acid-line);background:var(--acid-soft)}

  .warm-list{display:flex;flex-direction:column}
  .warm-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font-family:inherit}
  .warm-item:last-child{border-bottom:0}
  .warm-item__num{
    width:24px;height:24px;flex:none;display:grid;place-items:center;border:1px solid var(--line-2);
    border-radius:50%;font-family:var(--font-mono);font-size:9px;color:var(--dim);margin-top:1px;
  }
  .warm-item__main{flex:1;min-width:0}
  .warm-item__name{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .warm-item__sub{font-size:9.5px;color:var(--dim);margin-top:3px;line-height:1.45}
  .warm-item__check{
    width:26px;height:26px;flex:none;display:grid;place-items:center;border:1px solid #364038;border-radius:var(--r1);
    background:#080B09;color:#4F5B52;cursor:pointer;transition:all .16s;margin-top:1px;
  }
  .warm-item__check .icon{width:14px;height:14px;stroke-width:2.2}
  .warm-item.is-done .warm-item__num{border-color:var(--acid-line);color:var(--acid)}
  .warm-item.is-done .warm-item__name{color:var(--sub)}
  .warm-item.is-done .warm-item__check{background:var(--acid);border-color:var(--acid);color:#0A0D05}
  .warm-note{font-size:10px;line-height:1.6;color:#525E56;border-left:2px solid #2C342E;padding-left:9px;margin-top:12px}
  .warm-hero{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r4);background:linear-gradient(158deg,#151B16,#0C100D 72%)}
  .warm-hero__kicker{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;color:var(--acid)}
  .warm-hero__title{font-size:30px;font-weight:700;line-height:1.15;margin-top:8px}
  .warm-hero__sub{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.6}
  .warm-hero__tags{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}

  /* ---------- 动作库 ---------- */
  .lib-group{margin-top:18px}
  .lib-group__head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:2px}
  .lib-group__head h3{font-size:11px;font-weight:700;letter-spacing:.08em}
  .lib-group__head span{font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:.06em}
  .lib-row{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 0;
    border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font-family:inherit;cursor:pointer;
  }
  .lib-row:last-child{border-bottom:0}
  .lib-row:hover .lib-row__name{color:var(--acid)}
  .lib-row__main{flex:1;min-width:0}
  .lib-row__name{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;transition:color .16s}
  .lib-row__sub{font-size:9.5px;color:var(--dim);margin-top:3px}
  .lib-row__right{flex:none;display:flex;align-items:center;gap:8px}
  .lib-row__pr{font-family:var(--font-mono);font-size:9.5px;color:var(--sub);text-align:right;line-height:1.4}
  .lib-row__pr s{display:block;font-size:8.5px;color:#4E5A52;text-decoration:none}
  .lib-add{
    width:28px;height:28px;flex:none;display:grid;place-items:center;border:1px solid var(--line-2);
    border-radius:var(--r1);background:transparent;color:var(--sub);cursor:pointer;
  }
  .lib-add .icon{width:14px;height:14px}
  .lib-add:hover,.lib-add.is-added{border-color:var(--acid);color:var(--acid);background:var(--acid-soft)}
  .lib-add.is-added{pointer-events:none;opacity:.6}
  .lib-count{font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:.06em;margin-left:6px}

  /* ---------- 模板库 ---------- */
  .tpl-card{
    display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--line);border-radius:var(--r3);
    background:linear-gradient(160deg,#111612,#0B0F0C 75%);color:inherit;font-family:inherit;cursor:pointer;
    transition:border-color .16s,transform .12s;
  }
  .tpl-card:hover{border-color:var(--line-2)}
  .tpl-card:active{transform:scale(.996)}
  .tpl-card + .tpl-card{margin-top:7px}
  .tpl-card__row{display:flex;align-items:center;gap:8px}
  .tpl-card__name{font-size:15px;font-weight:700}
  .tpl-card__days{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;color:var(--dim)}
  .tpl-card__sub{display:block;font-size:11.5px;color:var(--sub);margin-top:5px;line-height:1.55}
  .tpl-card__meta{display:flex;gap:10px;margin-top:9px;font-family:var(--font-mono);font-size:9.5px;color:var(--dim);flex-wrap:wrap}
  .tpl-card__tags{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
  .tpl-day{padding:12px 0;border-bottom:1px solid var(--line)}
  .tpl-day:last-child{border-bottom:0}
  .tpl-day__head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .tpl-day__name{font-size:13px;font-weight:700}
  .tpl-day__focus{font-size:10px;color:var(--dim);margin-top:3px}
  .tpl-day__meta{font-family:var(--font-mono);font-size:9px;color:var(--dim)}
  .tpl-ex{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:10.5px;border-bottom:1px dashed rgba(255,255,255,.04)}
  .tpl-ex:last-child{border-bottom:0}
  .tpl-ex span:first-child{color:var(--sub)}
  .tpl-ex span:last-child{font-family:var(--font-mono);font-size:9px;color:var(--dim);white-space:nowrap}
  .tpl-edit-day{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
  .tpl-edit-day:first-of-type{border-top:0;padding-top:0}
  .tpl-edit-day__head{display:flex;align-items:center;gap:8px}
  .tpl-edit-day__head .tpl-day-name{flex:1;min-width:0}

  /* ---------- 进步 ---------- */
  .hero-metric{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:var(--r4);background:linear-gradient(158deg,#151B16,#0C100D 72%);position:relative;overflow:hidden}
  .hero-metric:after{content:"";position:absolute;right:-30px;top:-50px;width:150px;height:150px;border-radius:50%;border:1px solid rgba(199,255,58,.1)}
  .hero-metric__label{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;color:var(--dim)}
  .hero-metric__num{font-family:var(--font-display);font-size:50px;line-height:1;font-weight:600;color:var(--acid);margin-top:8px;display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums}
  .hero-metric__num small{font-family:var(--font-cn);font-size:11px;font-weight:400;color:var(--dim)}
  .hero-metric__meta{display:flex;gap:14px;margin-top:10px;font-family:var(--font-mono);font-size:9.5px;color:var(--dim);flex-wrap:wrap}
  .hero-metric__meta b{color:var(--sub);font-weight:500}
  .chart-card{margin-top:8px;padding:13px;border:1px solid var(--line);border-radius:var(--r3);background:#0B0F0C}
  .chart-card__head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .chart-card__head h3{font-size:11.5px;font-weight:700;letter-spacing:.04em}
  .chart-card__head span{font-family:var(--font-mono);font-size:9px;color:var(--dim)}
  .chart{margin-top:10px}
  .chart svg{display:block;width:100%;height:auto;overflow:visible}
  .chart .grid{stroke:#232A25;stroke-width:1}
  .chart .axis{font-family:var(--font-mono);font-size:8px;fill:#5D6961}
  .chart .axis--strong{fill:var(--sub)}
  .chart .bar{fill:#2E3931;transition:fill .2s}
  .chart .bar.is-hot{fill:var(--acid)}
  .chart .bar.is-empty{fill:#1A211C}
  .chart .line{fill:none;stroke:var(--acid);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .chart .line--sub{stroke:#6C7A71;stroke-width:1.4}
  .chart .line--ma{stroke:var(--acid);stroke-width:2}
  .chart .area{fill:url(#trendFill)}
  .chart .dot{fill:var(--acid);stroke:#0A0D05;stroke-width:1.5}
  .chart .dot--sub{fill:#6C7A71;stroke:#0A0D05;stroke-width:1.2}
  .chart-legend{display:flex;gap:14px;margin-top:8px;font-size:9px;color:var(--dim);font-family:var(--font-mono)}
  .chart-legend i{display:inline-block;width:12px;height:2px;background:var(--acid);vertical-align:middle;margin-right:4px}
  .chart-legend i.muted{background:#6C7A71;height:1.5px}
  .chart-empty{padding:26px 0;text-align:center;font-size:10.5px;color:var(--dim)}

  .pr-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .pr-row:last-child{border-bottom:0}
  .pr-row__rank{font-family:var(--font-mono);font-size:9px;color:#4E5A52;width:18px;flex:none}
  .pr-row__main{flex:1;min-width:0}
  .pr-row__name{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pr-row__sub{font-family:var(--font-mono);font-size:8.5px;color:var(--dim);margin-top:2px}
  .pr-row__val{flex:none;text-align:right}
  .pr-row__val b{font-family:var(--font-mono);font-size:12px;color:var(--acid);font-weight:600}
  .pr-row__val span{display:block;font-family:var(--font-mono);font-size:8.5px;color:var(--dim);margin-top:2px}

  /* ---------- 身体 ---------- */
  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .metric{border:1px solid var(--line);border-radius:var(--r2);padding:11px;background:#0C100E}
  .metric--wide{grid-column:span 2}
  .metric__label{font-size:9.5px;color:var(--dim);letter-spacing:.05em}
  .metric__val{display:flex;align-items:baseline;gap:4px;margin-top:6px}
  .metric__val b{font-family:var(--font-display);font-size:25px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
  .metric__val small{font-family:var(--font-cn);font-size:9.5px;color:var(--dim)}
  .metric__delta{font-family:var(--font-mono);font-size:9px;color:var(--acid);margin-top:5px}
  .metric__delta.is-flat{color:var(--dim)}
  .metric__delta.is-up{color:var(--acid)}
  .metric__delta.is-down{color:#FFB18F}
  .metric__date{font-family:var(--font-mono);font-size:8px;color:#4E5A52;margin-top:4px}

  .log-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .log-row:last-child{border-bottom:0}
  .log-row__main{flex:1;min-width:0}
  .log-row__title{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .log-row__sub{font-family:var(--font-mono);font-size:9px;color:var(--dim);margin-top:3px}
  .log-row__val{font-family:var(--font-mono);font-size:11px;color:var(--sub);text-align:right;white-space:nowrap}
  .del-btn{
    width:26px;height:26px;flex:none;display:grid;place-items:center;border:1px solid transparent;
    border-radius:var(--r1);background:transparent;color:#4E5A52;cursor:pointer;
  }
  .del-btn .icon{width:12px;height:12px}
  .del-btn:hover{color:#FF8F7B;border-color:rgba(255,106,77,.35);background:rgba(255,106,77,.06)}
  .add-btn{
    display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 9px;border:1px solid var(--line-2);
    border-radius:var(--r1);background:transparent;color:var(--sub);font-family:inherit;font-size:10.5px;cursor:pointer;
  }
  .add-btn:hover{color:var(--acid);border-color:var(--acid-line);background:var(--acid-soft)}
  .add-btn .icon{width:13px;height:13px}
  .section-head__action{display:flex;align-items:center;gap:6px}

  /* ---------- 我的 ---------- */
  .me-hero{display:flex;align-items:center;gap:13px;margin-top:20px}
  .me-avatar{
    width:54px;height:54px;flex:none;border-radius:var(--r3);background:var(--acid);color:#0A0D05;
    display:grid;place-items:center;font-family:var(--font-display);font-size:27px;font-weight:700;
    box-shadow:0 0 0 1px rgba(199,255,58,.25),0 10px 30px rgba(199,255,58,.08);
  }
  .me-name{font-size:19px;font-weight:700;cursor:text;border-bottom:1px dashed transparent;transition:border-color .16s}
  .me-name:hover{border-bottom-color:var(--line-3)}
  .me-name-input{
    width:100%;min-width:120px;font-family:inherit;font-size:19px;font-weight:700;color:var(--text);
    background:transparent;border:0;border-bottom:1px solid var(--acid);outline:none;padding:0 0 2px;
  }
  .me-sub{font-family:var(--font-mono);font-size:9.5px;color:var(--dim);margin-top:4px;letter-spacing:.03em}
  .menu{display:flex;flex-direction:column}
  .menu-row{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 0;
    border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font-family:inherit;cursor:pointer;
  }
  .menu-row:last-child{border-bottom:0}
  .menu-row:hover .menu-row__title{color:var(--acid)}
  .menu-row__icon{width:30px;height:30px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r1);color:var(--sub);background:#0C100E}
  .menu-row__icon .icon{width:15px;height:15px}
  .menu-row__main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .menu-row__title{font-size:12.5px;font-weight:600;transition:color .16s}
  .menu-row__sub{font-size:9.5px;color:var(--dim);margin-top:0}
  .menu-row__right{font-family:var(--font-mono);font-size:10px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .menu-row.danger .menu-row__title{color:#FF9C88}
  .menu-row.danger .menu-row__icon{color:#FF9C88;border-color:rgba(255,106,77,.28)}
  .notice{
    display:flex;gap:8px;align-items:flex-start;padding:10px 11px;border:1px dashed #2E3731;border-radius:var(--r2);
    font-size:10px;line-height:1.6;color:var(--dim);margin-top:10px;
  }
  .notice .icon{width:13px;height:13px;flex:none;color:var(--acid);margin-top:1px}
  .ver{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;color:#414B44;text-align:center;margin-top:24px}

  /* ---------- 浮动面板 / 表单 ---------- */
  #sheet-root{position:absolute;inset:0;z-index:104;display:none}
  #sheet-root.is-open{display:block}
  .sheet-backdrop{position:absolute;inset:0;background:rgba(3,5,4,.68);backdrop-filter:blur(5px);animation:fadeIn .2s ease}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;overscroll-behavior:contain;
    background:#101512;border-top:1px solid var(--line-2);border-radius:var(--r5) var(--r5) 0 0;
    padding:12px 16px calc(18px + env(safe-area-inset-bottom));
    animation:sheetUp .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -30px 70px rgba(0,0,0,.6);
  }
  .sheet::-webkit-scrollbar{display:none}
  .sheet__grip{width:34px;height:3px;border-radius:2px;background:#3A453D;margin:0 auto 12px}

  .sheet__foot{display:flex;gap:7px;margin-top:16px}
  .sheet__foot .btn{height:46px;font-size:13px}

  .sheet__danger{

  }
  .sheet__danger:hover{background:rgba(255,106,77,.1)}
  .sheet__danger .icon{width:13px;height:13px}

  .stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .stepper:last-child{border-bottom:0}
  .stepper__label{font-size:12px;font-weight:600}
  .stepper__hint{display:block;font-size:9px;color:var(--dim);font-weight:400;margin-top:2px}
  .stepper__ctrl{display:flex;align-items:center;gap:6px;flex:none}
  .stepper__btn{
    width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:var(--r1);
    background:transparent;color:var(--sub);cursor:pointer;
  }
  .stepper__btn:hover{color:var(--acid);border-color:var(--acid-line);background:var(--acid-soft)}
  .stepper__btn:disabled{opacity:.3;pointer-events:none}
  .stepper__btn .icon{width:13px;height:13px}
  .stepper__val{min-width:52px;text-align:center;font-family:var(--font-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .stepper__val small{font-family:var(--font-cn);font-size:9px;color:var(--dim);font-weight:400;margin-left:2px}

  .form-row{display:flex;flex-direction:column;gap:6px;margin-top:13px}
  .form-label{font-size:10px;color:var(--sub);letter-spacing:.04em}
  .form-label span{color:#4E5A52;font-size:9px;margin-left:4px}
  .form-input{
    width:100%;height:44px;background:#080B09;border:1px solid #29312B;border-radius:var(--r1);
    color:var(--text);font-family:var(--font-mono);font-size:15px;padding:0 12px;
    transition:border-color .16s,box-shadow .16s;
  }
  .form-input::placeholder{color:#414B44;font-family:var(--font-cn);font-size:11.5px}
  .form-input:focus{outline:none;border-color:var(--acid);box-shadow:0 0 0 2px rgba(199,255,58,.13)}
  .form-split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .form-tip{font-size:9.5px;line-height:1.55;color:#525E56;margin-top:8px}
  .chip-group{display:flex;flex-wrap:wrap;gap:5px}
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);margin-top:12px}
  .switch{position:relative;width:42px;height:24px;flex:none;border-radius:12px;border:1px solid #364038;background:#0B0F0C;cursor:pointer;transition:background .18s,border-color .18s}
  .switch:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#5E6A61;transition:transform .18s,background .18s}
  .switch.is-on{background:var(--acid-soft);border-color:var(--acid)}
  .switch.is-on:after{transform:translateX(18px);background:var(--acid)}

  /* 训练页热身 */
  .warm-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r2);background:#0B0F0C}
  .warm-summary span{font-size:10px;color:var(--dim)}
  .warm-summary b{font-family:var(--font-mono);font-size:10.5px;color:var(--acid)}
  .abs-block{margin-top:20px}
  .abs-block__head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
  .abs-block__head h2{font-size:12px;font-weight:700;letter-spacing:.06em}
  .abs-block__head span{font-family:var(--font-mono);font-size:9px;color:var(--dim)}

  .toast--wide{max-width:none}

</style>

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pad(n){ return String(n).padStart(2,'0'); }
function fmtNum(n){
  const r = Math.round((+n || 0) * 100) / 100;
  return String(r);
}
function fmtVol(n){ return Math.round(n || 0).toLocaleString('en-US'); }
function fmtK(n){
  if(n >= 10000) return (n/1000).toFixed(n >= 100000 ? 0 : 1) + 'k';

}
function fmtClock(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return pad(h) + ':' + pad(m) + ':' + pad(s);
}
function fmtMs(ms){
  ms = Math.max(0, ms || 0);
  const total = Math.ceil(ms/1000);
  return pad(Math.floor(total/60)) + ':' + pad(total%60);
}
function isoOf(d){
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function addDays(d, n){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
}
function parseISO(iso){
  const p = String(iso).split('-');
  return new Date(+p[0], +p[1]-1, +p[2]);
}
function daysBetween(a, b){
  return Math.round((parseISO(b) - parseISO(a)) / 86400000);
}
function shortDate(iso){

  return (d.getMonth()+1) + '/' + d.getDate();
}

function normalizeState(p){
  const d = defaultState();
  const st = Object.assign(d, p || {});
  st.onboard = Object.assign({step:1, goal:null, freq:null, template:null}, p && p.onboard || {});
  st.body = Object.assign({weights:[], measures:[], cardio:[]}, p && p.body || {});
  st.profile = Object.assign({name:'训练者 01'}, p && p.profile || {});
  st.ui = Object.assign(d.ui, p && p.ui || {});
  if(!st.plan || !Array.isArray(st.plan.days) || !st.plan.days.length) st.plan = null;
  if(!Array.isArray(st.history)) st.history = [];
  if(!Array.isArray(st.customEx)) st.customEx = [];
  if(!Array.isArray(st.templates)) st.templates = [];
  st.templates.forEach(t => {
    if(!Array.isArray(t.days)) t.days = [];
    t.days.forEach(d => { if(!Array.isArray(d.exercises)) d.exercises = []; });
  });
  if(!st.body.weights) st.body.weights = [];
  if(!st.body.measures) st.body.measures = [];
  if(!st.body.cardio) st.body.cardio = [];
  st.version = 2;
  return st;
}

    }

}

/* ---------- 第一批数据迁移 ---------- */
function migrateV1(v1){
  const st = defaultState();
  st.prs = v1.prs || {};
  st.onboard = v1.onboard || st.onboard;
  st.demo = false;
  const p = v1.plan;
  if(p && TEMPLATES.some(t => t.id === p.templateId)){
    const plan = buildPlan(p.templateId, p.goal, p.freq, p.startDate);
    plan.createdAt = p.createdAt || Date.now();
    if(Array.isArray(p.schedule)){
      plan.schedule = p.schedule.map((e, i) => {
        const base = {date:e.date, dow:e.dow, dayNum:e.dayNum, month:e.month};
        if(e.type !== 'train') return Object.assign(base, {type:'rest'});
        const day = plan.days.find(d => d.srcId === e.workoutId) ||
          getDayById(plan, plan.rotation[(e.indexInRotation || i) % plan.rotation.length]);
        return Object.assign(base, {type:'train', dayId:day.id, indexInRotation:e.indexInRotation || 0});
      });
    }
    st.plan = plan;
    st.history = (v1.history || []).map((h, i) => ({
      id: h.id || ('legacy_' + i),
      date: h.date,
      dayId: (plan.days.find(d => d.srcId === h.workoutId) || {}).id || null,
      workoutName: h.workoutName || '训练',
      volume: +h.volume || 0,
      sets: +h.sets || 0,
      totalSets: +h.totalSets || 0,
      duration: +h.duration || 0,
      prs: h.prs || [],
      breakdown: h.breakdown || [],
      lifts: (h.breakdown || []).filter(b => b.best).map(b => ({
        ex: b.name, weight: +b.best.weight || 0, reps: +b.best.reps || 0,
        volume: +b.volume || 0, sets: +b.sets || 0, e1rm: e1rm(b.best.weight, b.best.reps)
      }))
    }));
    if(v1.session && v1.session.date){
      const old = v1.session;
      const day = plan.days.find(d => d.srcId === old.workoutId) || plan.days[0];
      /* makeSession 依赖全局 S 读取计划与历史，临时切换后恢复 */
      const prevS = S;
      let s;
      try{
        S = st;
        s = makeSession({dayId:day.id, date:old.date});
      }finally{
        S = prevS;
      }
      s.elapsed = +old.elapsed || 0;
      s.currentEx = Math.min(+old.currentEx || 0, s.exercises.length - 1);
      (old.sets || []).forEach(os => {
        const row = s.sets.find(x => x.ex === os.ex && x.setIdx === os.setIdx && !x.done);
        if(row){ row.weight = os.weight; row.reps = os.reps; row.done = !!os.done; }
      });
      if(old.rest) s.rest = null;
      if(s.sets.some(x => x.done)){ s.phase = 'train'; s.warmupDone = s.warmup.map((w, i) => i); }
      st.session = s;
    }
    if(v1.lastSummary){
      const h = st.history.find(x => x.date === v1.lastSummary.date);
      st.lastSummary = h || null;
    }
    st.selectedDay = Math.min(Math.max(+v1.selectedDay || 0, 0), 6);
    if(st.session && st.session.date === todayISO()) st.view = 'workout';
    else if(st.lastSummary) st.view = 'summary';
    else st.view = 'main';
  }else{
    st.view = 'onboarding';
  }
  if(st.view === 'workout' && !st.session) st.view = 'main';
  if(st.view === 'summary' && !st.lastSummary) st.view = 'main';
  st.ui.tab = 'today';
  return st;
}

/* ---------- 计划模型 ---------- */
/* 与第一批 WORKOUTS 的 id 对齐，保证旧数据迁移时能匹配到同一训练日 */
const LEGACY_DAY_IDS = {
  fb:['fb-a','fb-b'],
  ul:['ul-upper','ul-lower'],
  ppl:['ppl-push','ppl-pull','ppl-legs'],
  fb3:['fb-a','fb-b','fb-c']
};

function planDaysFromTemplate(tpl){
  const legacy = LEGACY_DAY_IDS[tpl.id] || [];
  return tpl.days.map((d, i) => ({
    id: 'd' + (i + 1),
    srcId: legacy[i] || (tpl.id + '-' + (i + 1)),
    name: d.name,
    focus: d.focus || '自定义训练日',
    exercises: d.exercises.map(e => ({ex:e.ex, sets:e.sets, repsMin:e.repsMin, repsMax:e.repsMax, rest:e.rest})),
    abs: ABS_PAIRS[i % ABS_PAIRS.length].slice()
  }));
}

function buildSchedule(days, freq){
  const offsetsMap = {2:[0,3], 3:[0,2,4], 4:[0,2,4,5], 5:[0,1,3,4,6]};
  const offsets = offsetsMap[freq] || offsetsMap[3];
  const today = new Date();
  let ti = 0;
  const out = [];
  for(let i=0;i<7;i++){
    const d = addDays(today, i);
    const base = {date:isoOf(d), dow:DAY_CN[d.getDay()], dayNum:d.getDate(), month:d.getMonth()+1};
    if(offsets.indexOf(i) >= 0){
      const day = days[ti % days.length];
      out.push(Object.assign(base, {type:'train', dayId:day.id, indexInRotation:ti}));
      ti++;
    }else{
      out.push(Object.assign(base, {type:'rest'}));
    }
  }
  return out;
}

function buildPlan(templateId, goal, freq, startDate){
  const tpl = typeof templateId === 'string' ? templateById(templateId) : templateId;
  const days = planDaysFromTemplate(tpl);
  return {
    templateId: tpl.id,
    goal, freq,
    name: tpl.name,
    createdAt: Date.now(),
    startDate: startDate || todayISO(),
    days,
    rotation: days.map(d => d.id),
    schedule: buildSchedule(days, freq)
  };
}

function getDayById(plan, id){
  return (plan || S.plan || {days:[]}).days.find(d => d.id === id) || null;
}
function rotationDays(plan){
  const p = plan || S.plan;
  return p ? p.rotation.map(id => getDayById(p, id)).filter(Boolean) : [];
}
function ensurePlanFresh(){
  if(!S.plan) return;
  const today = todayISO();
  if(S.plan.schedule && S.plan.schedule[0] && S.plan.schedule[0].date === today) return;
  S.plan.schedule = buildSchedule(S.plan.days, S.plan.freq);
  if(S.session && S.session.date !== today) S.session = null;
  S.selectedDay = 0;
  save();
}

function dayStats(day){
  const all = day.exercises.concat((day.abs || []).map(a => Object.assign({ex:a, abs:true}, ABS_POOL[a])));
  const sets = all.reduce((a, e) => a + (+e.sets || 0), 0);
  const sec = all.reduce((a, e) => a + e.sets * (45 + e.rest), 0);
  return {
    main: day.exercises.length,
    abs: (day.abs || []).length,
    total: all.length,
    sets,
    minutes: Math.max(20, Math.round((sec + 360) / 60 / 5) * 5)
  };
}
function totalWeeklySets(){
  const plan = S.plan;
  if(!plan) return 0;
  const sched = plan.schedule || [];
  const trainDays = sched.filter(e => e.type === 'train' && getDayById(plan, e.dayId));
  if(!trainDays.length) return rotationDays().reduce((a, d) => a + dayStats(d).sets, 0);
  return trainDays.reduce((a, e) => a + dayStats(getDayById(plan, e.dayId)).sets, 0);
}
function repsText(cfg, name){
  if(isHold(name)) return (cfg.repsMax || cfg.repsMin) + ' 秒';
  return cfg.repsMin === cfg.repsMax ? String(cfg.repsMin) : cfg.repsMin + '-' + cfg.repsMax;
}

/* ---------- 热身 ---------- */
function warmupFor(day){
  const pats = day.exercises.map(e => exInfo(e.ex).pattern);
  const lower = pats.some(p => p === '蹲' || p === '髋铰链' || p === '腿后与小腿');
  const upper = pats.some(p => p === '水平推' || p === '垂直推' || p === '水平拉' || p === '垂直拉' || p === '手臂');
  let keys;
  if(lower && upper) keys = ['cardio','hip','squat','bridge','shoulder','scap'];
  else if(lower) keys = ['cardio','hip','squat','bridge','ankle'];
  else if(upper) keys = ['cardio','shoulder','band','scap','catcow'];
  else keys = ['cardio','catcow'];
  return keys.map((k, i) => Object.assign({id:i}, WARM_POOL[k]));
}

/* ---------- 训练会话 ---------- */
function lastLift(name){
  for(let i=0;i<S.history.length;i++){
    const hit = (S.history[i].lifts || []).find(l => l.ex === name);
    if(hit) return hit;
  }
  return null;
}
function prefillRow(name, cfg, setIdx){
  const info = exInfo(name);
  const last = lastLift(name);
  let weight = 0;
  if(!info.bw || (last && last.weight > 0)) weight = last ? last.weight : (info.base || 0);
  if(info.bw && !(last && last.weight > 0)) weight = 0;
  const reps = info.hold ? (cfg.repsMax || 45) : (last && last.reps ? last.reps : (cfg.repsMax || 10));
  return {weight:String(fmtNum(weight)), reps:String(reps)};
}

function exercisesOfDay(day){
  return day.exercises.map(e => ({ex:e.ex, sets:e.sets, repsMin:e.repsMin, repsMax:e.repsMax, rest:e.rest}))
    .concat((day.abs || []).map(a => Object.assign({ex:a, abs:true}, ABS_POOL[a])));
}

function makeSession(entry){
  const day = getDayById(S.plan, entry.dayId) || rotationDays()[0];
  const exs = exercisesOfDay(day);
  const sets = [];
  exs.forEach((e, ei) => {
    for(let i=0;i<e.sets;i++){
      const pf = prefillRow(e.ex, e, i);
      sets.push({ex:e.ex, exIdx:ei, setIdx:i, weight:pf.weight, reps:pf.reps, done:false});
    }
  });
  return {
    dayId: day.id,
    dayName: day.name,
    templateName: templateById(S.plan.templateId).name,
    date: entry.date || todayISO(),
    elapsed: 0,
    phase: 'warmup',
    currentEx: 0,
    warmup: warmupFor(day),
    warmupDone: [],
    exercises: exs,
    sets,
    rest: null
  };
}

/* ---------- 汇总与记录 ---------- */
function buildSummary(){
  const s = S.session;
  /* 完成组：勾选且次数/秒数有值；容量只算有重量的组（自重动作组数照常算） */
  const doneRows = s.sets.filter(x => x.done && (+x.reps) > 0);
  const weightedRows = doneRows.filter(x => (+x.weight) > 0);
  const names = [];
  s.sets.forEach(x => { if(names.indexOf(x.ex) < 0) names.push(x.ex); });
  const breakdown = names.map(name => {
    const allRows = s.sets.filter(x => x.ex === name);
    const rows = doneRows.filter(x => x.ex === name);
    const wRows = weightedRows.filter(x => x.ex === name);
    let best = null;
    wRows.forEach(r => {
      if(!best || (+r.weight) > best.weight || ((+r.weight) === best.weight && (+r.reps) > best.reps)){
        best = {weight:+r.weight, reps:+r.reps};
      }
    });
    return {name, sets:rows.length, planSets:allRows.length, best, volume:wRows.reduce((a, r) => a + (+r.weight)*(+r.reps), 0), bw:isBW(name)};
  });
  const prs = [];
  breakdown.forEach(b => {
    if(!b.best || b.bw) return;
    const old = S.prs[b.name];
    if(typeof old === 'number' && b.best.weight > old + 0.0001){
      prs.push({name:b.name, from:old, to:b.best.weight, delta:b.best.weight - old});
      S.prs[b.name] = b.best.weight;
    }else if(typeof old !== 'number'){
      S.prs[b.name] = b.best.weight;
    }
  });
  const lifts = breakdown.filter(b => b.best).map(b => ({
    ex:b.name, weight:b.best.weight, reps:b.best.reps,
    e1rm:e1rm(b.best.weight, b.best.reps), volume:b.volume, sets:b.sets
  }));
  return {
    id: uid('h'),
    date: s.date,
    dayId: s.dayId,
    workoutName: s.dayName,
    volume: weightedRows.reduce((a, r) => a + (+r.weight)*(+r.reps), 0),
    sets: doneRows.length,
    totalSets: s.sets.length,
    duration: s.elapsed,
    prs,
    breakdown,
    lifts
  };
}

/* ---------- 示例数据（仅新用户） ---------- */
function seedDemo(plan){
  const today = new Date();
  const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const hist = [];
  const weeks = 12;
  let counter = 0;
  for(let w=weeks-1; w>=0; w--){
    for(let s=0; s<plan.freq; s++){
      const d = addDays(todayStart, -(w*7 + 2) + s*2);
      if(d >= todayStart) continue;
      const day = rotationDays(plan)[counter % plan.rotation.length];
      counter++;
      if(!day) continue;
      const exs = exercisesOfDay(day);
      const factor = 0.80 + (weeks-1-w) * 0.012;
      const lifts = [];
      let volume = 0, setsDone = 0;
      const breakdown = [];
      exs.forEach(e => {
        const info = exInfo(e.ex);
        let best = null, mVol = 0, mSets = 0;
        for(let i=0;i<e.sets;i++){
          let weight = 0;
          if(!info.bw) weight = roundStep((info.base || 20) * factor * (1 + i*0.006), info.step || 1);
          const reps = info.hold ? 45 : Math.max(e.repsMin, Math.round((e.repsMin + e.repsMax)/2) + (i === 0 ? 2 : 0));
          if(!info.bw) mVol += weight * reps;
          mSets++;
          if(weight > 0 && (!best || weight > best.weight)) best = {weight, reps};
        }
        if(best) lifts.push({ex:e.ex, weight:best.weight, reps:best.reps, e1rm:e1rm(best.weight,best.reps), volume:mVol, sets:mSets});
        breakdown.push({name:e.ex, sets:mSets, planSets:e.sets, best, volume:mVol, bw:info.bw});
        volume += mVol; setsDone += mSets;
      });
      hist.push({
        id: uid('demo'),
        date: isoOf(d),
        dayId: day.id,
        workoutName: day.name,
        volume,
        sets: setsDone,
        totalSets: setsDone,
        duration: setsDone * 95 + 420,
        prs: [],
        breakdown,
        lifts
      });
    }
  }
  hist.sort((a, b) => a.date < b.date ? 1 : -1);

  const weights = [];
  for(let d=84; d>=0; d-=3){
    weights.push({
      id: uid('w'),
      date: isoOf(addDays(today, -d)),
      kg: Math.round((78.4 - (84-d)*0.033 + Math.sin(d/5)*0.22) * 10) / 10
    });
  }
  const measures = [
    {id:uid('m'), date:isoOf(addDays(today,-84)), chest:99, waist:84, hip:97, arm:35, leg:56},
    {id:uid('m'), date:isoOf(addDays(today,-7)), chest:100, waist:81.5, hip:96, arm:35.8, leg:56.5}
  ];
  const cardio = [];
  const cTypes = ['爬坡走','跑步','单车','椭圆机','划船机','快走'];
  for(let i=0;i<9;i++){
    const type = cTypes[i % cTypes.length];
    cardio.push({
      id: uid('c'),
      date: isoOf(addDays(today, -(i*8 + 2))),
      type,
      minutes: 25 + (i % 4) * 5,
      incline: CARDIO_NO_INCLINE.indexOf(type) >= 0 ? null : (6 + i % 5),
      speed: type === '单车' ? null : Math.round((5.2 + (i % 5) * 0.6) * 10) / 10
    });
  }
  hist.sort((a, b) => a.date < b.date ? 1 : -1);
  S.history = hist;
  S.body = {weights, measures, cardio};
  S.demo = true;
}

function clearDemo(){
  S.history = [];
  S.body = {weights:[], measures:[], cardio:[]};
  S.demo = false;
  S.lastSummary = null;
  save();
}
