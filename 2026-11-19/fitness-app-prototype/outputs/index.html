let CUSTOM_DRAFT = {name:'', group:'胸', equip:'哑铃', unilateral:false};
let TPL_DRAFT = null;

function emptyTplDay(n){
  return {id:uid('td'), name:'Day ' + (n || 1), exercises:[]};
}
function tplDraftDay(id){
  return TPL_DRAFT ? TPL_DRAFT.days.find(d => d.id === id) : null;
}

function allExNames(){
  return Object.keys(EX_LIB).concat((S.customEx || []).map(c => c.name));
}
function bestWeightOf(name){
  if(typeof S.prs[name] === 'number') return S.prs[name];
  const info = exInfo(name);
  return info.pr || 0;
}
function libRow(name, mode, dayId){
  const info = exInfo(name);
  const pr = bestWeightOf(name);
  const last = lastLift(name);
  const pick = mode === 'pick' || mode === 'tplpick';
  const host = mode === 'pick' ? getDayById(S.plan, dayId) : (mode === 'tplpick' ? tplDraftDay(dayId) : null);
  const already = pick && host && host.exercises.some(e => e.ex === name);
  const right = pick ?
    '<button class="lib-add ' + (already ? 'is-added' : '') + '" data-action="' + (mode === 'pick' ? 'picker-add' : 'tpl-picker-add') + '" data-ex="' + esc(name) + '" data-day-id="' + dayId + '" aria-label="' + (already ? '已添加' : '添加 ' + name) + '">' +
      icon(already ? 'check' : 'plus') + '</button>' :
    '<div class="lib-row__pr">' + (info.bw ? '自重' : (pr ? fmtNum(pr) + ' kg' : '—')) + '<s>' + (info.bw ? (info.hold ? '计时' : '次数') : 'PR') + '</s></div>' + icon('chevron-right');
  return '<div class="lib-row">' +
    '<div class="lib-row__main" ' + (pick ? '' : 'data-action="lib-info" data-ex="' + esc(name) + '" style="cursor:pointer"') + '>' +
      '<div class="lib-row__name">' + esc(name) +
        (info.unilateral ? '<span class="mini-tag">单侧</span>' : '') +
        (info.custom ? '<span class="mini-tag mini-tag--acid">自定义</span>' : '') +
      '</div>' +
      '<div class="lib-row__sub">' + esc(info.muscle) + ' · ' + esc(info.equip) + (last ? ' · 上次 ' + fmtNum(last.weight) + '×' + last.reps : '') + '</div>' +
    '</div>' +
    '<div class="lib-row__right">' + right + '</div>' +
  '</div>';
}

function filteredExNames(){
  const q = libQuery.trim().toLowerCase();
  return allExNames().filter(name => {
    const info = exInfo(name);
    if(S.ui.libGroup !== '全部' && info.group !== S.ui.libGroup) return false;
    if(S.ui.libEquip !== '全部' && info.equip !== S.ui.libEquip) return false;
    if(!q) return true;
    return (name + ' ' + info.muscle + ' ' + info.group + ' ' + info.equip + ' ' + info.pattern).toLowerCase().indexOf(q) >= 0;
  });
}

function libResultsHtml(mode, dayId){
  const names = filteredExNames();
  if(!names.length){
    return '<div class="empty" style="margin-top:14px"><b>没有匹配的动作</b>换个关键词，或清空筛选试试。</div>';
  }
  if(mode === 'pick' || mode === 'tplpick'){
    const groups = {};
    names.forEach(n => {
      const p = exInfo(n).pattern;
      (groups[p] = groups[p] || []).push(n);
    });
    const order = PATTERNS.concat(['自定义']);
    return order.filter(p => groups[p]).map(p =>
      '<div class="lib-group">' +
        '<div class="lib-group__head"><h3>' + p + '</h3><span>' + groups[p].length + ' 个</span></div>' +
        groups[p].map(n => libRow(n, mode, dayId)).join('') +
      '</div>'
    ).join('');
  }
  const groups = {};
  names.forEach(n => {
    const p = exInfo(n).pattern;
    (groups[p] = groups[p] || []).push(n);
  });
  const order = PATTERNS.concat(['自定义']);
  return order.filter(p => groups[p]).map(p =>
    '<div class="lib-group">' +
      '<div class="lib-group__head"><h3>' + p + '</h3><span>' + groups[p].length + ' 个</span></div>' +
      groups[p].map(n => libRow(n, 'browse')).join('') +
    '</div>'
  ).join('');
}

/* ============================================================
   5. 进步 · 图表与统计
   ============================================================ */

function mondayOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const w = (x.getDay() + 6) % 7;
  return addDays(x, -w);
}
function niceMax(v){
  if(!(v > 0)) return 100;
  const raw = v * 1.08;
  const exp = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / exp;
  const nice = f <= 1 ? 1 : f <= 1.2 ? 1.2 : f <= 1.5 ? 1.5 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 3 ? 3 : f <= 4 ? 4 : f <= 5 ? 5 : f <= 6 ? 6 : f <= 8 ? 8 : 10;
  return nice * exp;
}

function svgBars(bars, opts){
  const o = opts || {};
  const W = 326, H = 170, L = 32, R = 6, T = 20, B = 25;
  const pw = W - L - R, ph = H - T - B;
  const max = niceMax(Math.max.apply(null, bars.map(b => b.value).concat([1])));
  const n = Math.max(1, bars.length);
  const slot = pw / n;
  const bw = Math.min(28, slot * 0.56);
  const y = v => T + ph - (v / max) * ph;
  let g = '';
  [0, 0.5, 1].forEach(k => {
    const v = max * k, yy = y(v);
    g += '<line class="grid" x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + (W-R) + '" y2="' + yy.toFixed(1) + '"/>';
    g += '<text class="axis" x="' + (L-5) + '" y="' + (yy+3).toFixed(1) + '" text-anchor="end">' + (v ? fmtK(v) : '0') + '</text>';
  });
  let body = '';
  /* 长途数据按月份标注横轴，避免每个柱都挤一个日期 */
  let monthIdx = null;
  if(o.monthAxis){
    monthIdx = [];
    for(let i=1;i<bars.length;i++){
      if(parseISO(bars[i].start).getMonth() !== parseISO(bars[i-1].start).getMonth()) monthIdx.push(i);
    }
    if(monthIdx.length > 6){
      const step = Math.ceil(monthIdx.length / 6);
      monthIdx = monthIdx.filter((v, k) => k % step === 0 || k === monthIdx.length - 1);
    }
  }
  bars.forEach((b, i) => {
    const x = L + slot * i + (slot - bw) / 2;
    const top = y(b.value);
    const h = Math.max(b.value > 0 ? 2 : 1, y(0) - top);
    const hot = i === n - 1;
    body += '<rect class="bar ' + (hot ? 'is-hot' : '') + (b.value <= 0 ? ' is-empty' : '') + '" x="' + x.toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2"/>';
    if(hot && b.value > 0){
      body += '<text class="axis axis--strong" x="' + (x + bw/2).toFixed(1) + '" y="' + (top - 5).toFixed(1) + '" text-anchor="middle">' + fmtK(b.value) + '</text>';
    }
    const show = monthIdx ? monthIdx.indexOf(i) >= 0 : (n <= 5 ? true : (i % 3 === 0 || i === n - 1));
    if(show){
      const label = monthIdx ? (parseISO(b.start).getMonth() + 1) + '月' : b.label;
      body += '<text class="axis" x="' + (L + slot * i + slot/2).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle">' + label + '</text>';
    }
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + (o.label || '柱状图') + '">' + g + body + '</svg>';
}

function svgSeries(series, labels, opts){
  const o = opts || {};
  const W = 326, H = 170, L = 34, R = 8, T = 18, B = 26;
  const pw = W - L - R, ph = H - T - B;
  const all = [];
  series.forEach(s => s.values.forEach(v => { if(typeof v === 'number' && isFinite(v)) all.push(v); }));
  let lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
  if(!all.length){ lo = 0; hi = 1; }
  const span = (hi - lo) || Math.abs(hi) * 0.15 || 1;
  lo -= span * 0.2; hi += span * 0.2;
  if(o.baseZero) lo = 0;
  const n = Math.max.apply(null, series.map(s => s.values.length).concat([1]));
  const x = i => n <= 1 ? L + pw/2 : L + (i / (n - 1)) * pw;
  const y = v => T + ph - ((v - lo) / (hi - lo)) * ph;
  const baseY = T + ph;
  let g = '';
  [0, 0.5, 1].forEach(k => {
    const v = lo + (hi - lo) * k, yy = y(v);
    g += '<line class="grid" x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + (W-R) + '" y2="' + yy.toFixed(1) + '"/>';
    g += '<text class="axis" x="' + (L-5) + '" y="' + (yy+3).toFixed(1) + '" text-anchor="end">' + (o.fmt ? o.fmt(v) : Math.round(v)) + '</text>';
  });
  let body = '';
  series.forEach((s, si) => {
    const pts = s.values.map((v, i) => [x(i), y(v)]);
    if(!pts.length) return;
    if(s.area && pts.length > 1){
      body += '<path class="area" d="M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') +
        ' L' + pts[pts.length-1][0].toFixed(1) + ' ' + baseY + ' L' + pts[0][0].toFixed(1) + ' ' + baseY + ' Z"/>';
    }
    body += '<polyline class="line ' + (s.cls || '') + '" points="' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/>';
    if(s.dots !== false){
      pts.forEach(p => {
        body += '<circle class="dot ' + (s.dotCls || '') + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (s.dotR || 2.6) + '"/>';
      });
    }
  });
  if(labels && labels.length){
    const idx = n <= 1 ? [0] : (n <= 5 ? [0, n-1] : [0, Math.floor((n-1)/2), n-1]);
    idx.forEach((i, k) => {
      const yi = n <= 1 ? x(0) : x(i);
      body += '<text class="axis" x="' + yi.toFixed(1) + '" y="' + (H - 7) + '" text-anchor="' + (k === 0 ? 'start' : (k === idx.length - 1 ? 'end' : 'middle')) + '">' + labels[i] + '</text>';
    });
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + (o.label || '趋势图') + '">' + g + body + '</svg>';
}

function weeklyBuckets(range){
  const thisMon = mondayOf(new Date());
  let n;
  if(range === 'all'){
    let earliest = null;
    S.history.forEach(h => {
      const d = parseISO(h.date);
      if(!earliest || d < earliest) earliest = d;
    });
    n = earliest ? Math.max(4, Math.round((thisMon - mondayOf(earliest)) / 604800000) + 1) : 4;
    n = Math.min(260, n);
  }else{
    n = range === '3m' ? 13 : 4;
  }
  const buckets = [];
  for(let i=n-1;i>=0;i--){
    const mon = addDays(thisMon, -7*i);
    buckets.push({label:shortDate(isoOf(mon)), value:0, start:isoOf(mon)});
  }
  const today = todayISO();
  S.history.forEach(h => {
    const diff = Math.round((thisMon - mondayOf(parseISO(h.date))) / 604800000);
    if(diff >= 0 && diff < n) buckets[n - 1 - diff].value += (+h.volume || 0);
  });
  return buckets;
}

function prRows(){
  const map = {};
  S.history.forEach(h => {
    (h.lifts || []).forEach(l => {
      if(!(l.weight > 0) || !(l.reps > 0)) return;
      const cur = map[l.ex] || (map[l.ex] = {ex:l.ex, weight:0, reps:0, e1rm:0, date:h.date});
      if(l.weight > cur.weight || (l.weight === cur.weight && l.reps > cur.reps)){
        cur.weight = l.weight; cur.reps = l.reps; cur.date = h.date;
      }
      const e = e1rm(l.weight, l.reps);
      if(e > cur.e1rm){ cur.e1rm = e; cur.e1rmDate = h.date; }
    });
  });
  return Object.keys(map).map(k => map[k]).filter(r => r.weight > 0)
    .sort((a, b) => b.e1rm - a.e1rm);
}

function historyExNames(){
  const seen = {};
  const out = [];
  S.history.forEach(h => (h.lifts || []).forEach(l => {
    if(l.weight > 0 && !seen[l.ex]){ seen[l.ex] = 1; out.push(l.ex); }
  }));
  return out;
}

function exSeries(name, days){
  const today = todayISO();
  const list = S.history
    .filter(h => daysBetween(h.date, today) <= days)
    .map(h => {
      const l = (h.lifts || []).find(x => x.ex === name);
      return l && l.e1rm > 0 ? {date:h.date, value:l.e1rm} : null;
    })
    .filter(Boolean);
  list.sort((a, b) => a.date < b.date ? -1 : 1);
  return list;
}

function viewProgress(){
  if(!S.plan) return viewOnboarding();
  const range = S.ui.progressRange || '4w';
  const days = range === '4w' ? 28 : range === '3m' ? 90 : Infinity;
  const buckets = weeklyBuckets(range);
  const thisWeek = buckets[buckets.length - 1].value;
  const lastWeek = buckets[buckets.length - 2] ? buckets[buckets.length - 2].value : 0;
  const avg = range === 'all'
    ? buckets.reduce((a, b) => a + b.value, 0) / Math.max(1, buckets.length)
    : buckets.slice(-4).reduce((a, b) => a + b.value, 0) / Math.min(4, buckets.length);
  const sessions = range === 'all' ? S.history.length : S.history.filter(h => daysBetween(h.date, todayISO()) <= days).length;
  const delta = lastWeek ? Math.round((thisWeek - lastWeek) / lastWeek * 100) : 0;

  const prs = prRows();
  const shown = S.ui.prAll ? prs : prs.slice(0, 8);
  const names = historyExNames();
  let sel = S.ui.progressEx;
  if(names.indexOf(sel) < 0) sel = names.indexOf('杠铃深蹲') >= 0 ? '杠铃深蹲' : names[0];
  S.ui.progressEx = sel || null;
  const series = sel ? exSeries(sel, days) : [];
  const last = series.length ? series[series.length - 1].value : 0;
  const first = series.length ? series[0].value : 0;
  const exDelta = last && first ? Math.round((last - first) / first * 100) : 0;

  const rangeLabel = range === '3m' ? '近 3 个月' : (range === 'all' ? '全部' : '近 4 周');
  const avgLabel = range === 'all' ? buckets.length + ' 周均值' : (range === '3m' ? '13 周均值' : '4 周均值');
  const hasHistory = S.history.length > 0;

  return shellTab('progress',

        '<button class="' + (range === '4w' ? 'is-on' : '') + '" data-action="range" data-value="4w">近 4 周</button>' +
        '<button class="' + (range === '3m' ? 'is-on' : '') + '" data-action="range" data-value="3m">近 3 个月</button>' +
        '<button class="' + (range === 'all' ? 'is-on' : '') + '" data-action="range" data-value="all">全部</button>' +
      '</div>' +
      '<div class="hero-metric">' +
        '<div class="hero-metric__label">本周训练容量 · ' + rangeLabel + '</div>' +
        '<div class="hero-metric__num">' + fmtVol(thisWeek) + '<small>KG</small></div>' +
        '<div class="hero-metric__meta">' +
          '<span>较上周 <b>' + (delta >= 0 ? '+' : '') + delta + '%</b></span>' +
          '<span>' + avgLabel + ' <b>' + fmtVol(avg) + '</b></span>' +
          '<span>训练 <b>' + sessions + '</b> 次</span>' +
        '</div>' +
      '</div>' +
      '<div class="chart-card">' +
        '<div class="chart-card__head"><h3>周训练容量</h3><span>' + (range === 'all' ? buckets.length + ' 周' : (range === '3m' ? '13 周' : '4 周')) + ' · KG</span></div>' +
        (hasHistory ? '<div class="chart">' + svgBars(buckets, {label:'周训练容量', monthAxis: range === 'all'}) + '</div>' :
          '<div class="chart-empty">完成第一次训练后，这里开始累计周容量。</div>') +
        '<div class="chart-legend"><span><i></i>每周总容量</span><span>按周一至周日统计</span></div>' +
      '</div>' +
      '<div class="section-head"><h2>PR 榜</h2><span>最好重量 · 预估 1RM</span></div>' +
      (prs.length ?
        '<div class="panel" style="padding:2px 14px">' +
          shown.map((r, i) =>
            '<div class="pr-row">' +
              '<span class="pr-row__rank">' + pad(i + 1) + '</span>' +
              '<div class="pr-row__main"><div class="pr-row__name">' + esc(r.ex) + '</div><div class="pr-row__sub">' + fmtNum(r.weight) + ' kg × ' + r.reps + ' · ' + shortDate(r.date) + '</div></div>' +
              '<div class="pr-row__val"><b>' + fmtNum(r.e1rm) + '</b><span>e1RM kg</span></div>' +
            '</div>'
          ).join('') +
        '</div>' +
        (prs.length > 8 ? '<button class="text-btn" style="display:block;margin:10px auto 0" data-action="pr-all">' + (S.ui.prAll ? '收起' : '查看全部 ' + prs.length + ' 项') + '</button>' : '') :
        '<div class="empty"><b>还没有 PR</b>完成带重量的训练组后，这里会记录最好重量和预估 1RM。</div>') +
      '<div class="section-head"><h2>单动作趋势</h2><span>预估 1RM · ' + rangeLabel + '</span></div>' +
      (names.length ?
        '<div class="chips" style="margin-top:2px">' + names.map(n =>
          '<button class="chip ' + (n === sel ? 'is-on' : '') + '" data-action="progress-ex" data-ex="' + esc(n) + '">' + esc(n) + '</button>'
        ).join('') + '</div>' : '') +
      (sel ?
        '<div class="chart-card" style="margin-top:10px">' +
          '<div class="chart-card__head"><h3>' + esc(sel) + '</h3><span>' + (series.length ? series.length + ' 次训练' : '暂无数据') + '</span></div>' +
          (series.length > 1 ?
            '<div class="chart">' + svgSeries([{values:series.map(p => p.value), area:true, dotR:2.4}], series.map(p => shortDate(p.date)), {fmt:v => Math.round(v), label:sel + ' 预估 1RM'}) + '</div>' :
            '<div class="chart-empty">' + (series.length === 1 ? '再完成一次「' + esc(sel) + '」就能看到趋势。' : '当前时间范围里没有这个动作的数据。') + '</div>') +
          (series.length ?
            '<div class="chart-legend"><span><i></i>预估 1RM</span><span>最新 <b style="color:var(--acid)">' + fmtNum(last) + ' kg</b></span><span>' + (exDelta >= 0 ? '+' : '') + exDelta + '%</span></div>' : '') +
        '</div>' :
        '<div class="empty"><b>还没有单动作数据</b>完成训练后可以在这里选动作查看曲线。</div>') +
      (!hasHistory ? '<div class="notice">' + icon('info') + '<span>当前没有训练历史。去「今天」完成一次训练，进步页会自动更新；如果你的第一批数据还在，会自动迁移到这里。</span></div>' : '') +
    '</div>'
  );
}

/* ===== 06-body.js ===== */
/* ============================================================
   6. 身体 · 体重 / 围度 / 有氧
   ============================================================ */

function signed(v, unit, digits){
  const r = Math.round((+v || 0) * Math.pow(10, digits == null ? 1 : digits)) / Math.pow(10, digits == null ? 1 : digits);
  if(Math.abs(r) < 0.0001) return '0' + (unit || '');
  return (r > 0 ? '+' : '') + r + (unit || '');
}
function weightsAsc(){
  return S.body.weights.slice().sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
}
function measuresAsc(){
  return S.body.measures.slice().sort((a, b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
}
function latestMeasure(key){
  const arr = measuresAsc().filter(m => typeof m[key] === 'number' && m[key] > 0);
  return arr.length ? arr[arr.length - 1] : null;
}
function cardioWeekMinutes(){
  const mon = isoOf(mondayOf(new Date()));
  return S.body.cardio.filter(c => c.date >= mon && c.date <= todayISO()).reduce((a, c) => a + (+c.minutes || 0), 0);
}

function viewBody(){
  if(!S.plan) return viewOnboarding();
  const allW = weightsAsc();
  const ws = allW.filter(w => +w.kg > 0);
  const latest = ws.length ? ws[ws.length - 1] : null;
  const bfs = allW.filter(w => +w.bf > 0);
  const bfLatest = bfs.length ? bfs[bfs.length - 1] : null;
  const bfPrev = bfs.length > 1 ? bfs[bfs.length - 2] : null;
  const bfDelta = bfLatest && bfPrev ? bfLatest.bf - bfPrev.bf : null;
  const base = latest ? ws.filter(w => w.date <= isoOf(addDays(parseISO(latest.date), -7))).pop() : null;
  const weekDelta = latest && base ? latest.kg - base.kg : 0;
  const ma = ws.map((w, i) => {
    const from = isoOf(addDays(parseISO(w.date), -6));
    const slice = ws.filter(x => x.date >= from && x.date <= w.date);
    return slice.reduce((a, x) => a + (+x.kg || 0), 0) / slice.length;
  });
  const latestMA = ma.length ? ma[ma.length - 1] : 0;
  const recent = allW.slice(-3).reverse();
  const cardio = S.body.cardio.slice().sort((a, b) => a.date < b.date ? 1 : -1);
  const measures = measuresAsc();

  const metrics = MEASURES.map((m, i) => {
    const arr = measures.filter(x => typeof x[m.key] === 'number' && x[m.key] > 0);
    const cur = arr.length ? arr[arr.length - 1] : null;
    const prev = arr.length > 1 ? arr[arr.length - 2] : null;
    return {key:m.key, name:m.name, cur, prev, delta: cur && prev ? cur[m.key] - prev[m.key] : null};
  });

  return shellTab('body',
    '<div class="pg">' +
      '<div class="pg-head"><div><div class="pg-eyebrow">BODY / 身体</div><h1 class="pg-title">身体</h1>' +
        '<p class="pg-sub">体重、围度和有氧记录。趋势比单次数字更重要。</p></div></div>' +

      '<div class="section-head"><h2>体重</h2><div class="section-head__action"><span>7 日移动平均</span><button class="add-btn" data-action="add-weight">' + icon('plus') + '记录</button></div></div>' +
      '<div class="hero-metric" style="margin-top:4px">' +
        '<div class="hero-metric__label">当前体重</div>' +
        '<div class="hero-metric__num">' + (latest ? fmtNum(latest.kg) : '—') + '<small>KG</small></div>' +
        '<div class="hero-metric__meta">' +
          '<span>较 7 日前 <b>' + (latest ? signed(weekDelta, ' kg') : '—') + '</b></span>' +
          '<span>7 日均 <b>' + (latestMA ? fmtNum(latestMA) + ' kg' : '—') + '</b></span>' +
          '<span>' + ws.length + ' 条记录</span>' +
        '</div>' +
      '</div>' +
      (ws.length > 1 ?
        '<div class="chart-card">' +
          '<div class="chart-card__head"><h3>体重曲线</h3><span>近 12 周 · KG</span></div>' +
          '<div class="chart">' + svgSeries(
            [{values:ma, area:true, dots:false, cls:'line--ma'}, {values:ws.map(w => +w.kg), cls:'line--sub', dotCls:'dot--sub', dotR:2.1}],
            ws.map(w => shortDate(w.date)),
            {fmt:v => v.toFixed(1), label:'体重曲线'}
          ) + '</div>' +
          '<div class="chart-legend"><span><i></i>7 日均线</span><span><i class="muted"></i>单次记录</span></div>' +
        '</div>' :
        '<div class="empty" style="margin-top:8px"><b>还没有体重曲线</b>至少记录两次体重，就能看到 7 日移动平均。</div>') +
      (recent.length ?
        '<div class="panel" style="margin-top:8px;padding:2px 14px">' + recent.map(w => {
          const hasKg = +w.kg > 0;
          const hasBf = +w.bf > 0;
          const title = hasKg ? fmtNum(w.kg) + ' kg' : '体脂 ' + fmtNum(w.bf) + '%';
          const val = hasKg && hasBf ? '体脂 ' + fmtNum(w.bf) + '%' : (w.note ? esc(w.note) : '');
          return '<div class="log-row">' +
            '<div class="log-row__main"><div class="log-row__title">' + title + '</div><div class="log-row__sub">' + w.date.replace(/-/g, '.') + '</div></div>' +
            '<div class="log-row__val">' + val + '</div>' +
            '<button class="del-btn" data-action="del-weight" data-id="' + w.id + '" aria-label="删除体重记录">' + icon('trash') + '</button>' +
          '</div>';
        }).join('') + '</div>' : '') +

      '<div class="section-head"><h2>体脂</h2><div class="section-head__action"><span>单位 %</span><button class="add-btn" data-action="add-weight">' + icon('plus') + '记录</button></div></div>' +
      '<div class="hero-metric" style="margin-top:4px">' +
        '<div class="hero-metric__label">当前体脂率</div>' +
        '<div class="hero-metric__num">' + (bfLatest ? fmtNum(bfLatest.bf) : '—') + '<small>%</small></div>' +
        '<div class="hero-metric__meta">' +
          (bfLatest
            ? '<span>' + (bfPrev ? '较上次 <b>' + signed(bfDelta, '%') + '</b>' : '<b>首次记录</b>') + '</span>'
            : '<span>未记录</span>') +
          '<span>' + bfs.length + ' 条记录</span>' +
        '</div>' +
      '</div>' +
      (bfs.length > 1 ?
        '<div class="chart-card">' +
          '<div class="chart-card__head"><h3>体脂率曲线</h3><span>' + bfs.length + ' 次记录 · %</span></div>' +
          '<div class="chart">' + svgSeries(
            [{values:bfs.map(w => +w.bf), area:true, dotR:2.4}],
            bfs.map(w => shortDate(w.date)),
            {fmt:v => v.toFixed(1), label:'体脂率曲线'}
          ) + '</div>' +
          '<div class="chart-legend"><span><i></i>体脂率</span><span>独立纵轴 · 百分比</span></div>' +
        '</div>' :
        '<div class="empty" style="margin-top:8px"><b>' + (bfs.length ? '再记录一次体脂就能看到曲线' : '还没有体脂记录') + '</b>' + (bfs.length ? '至少两条记录才能画出趋势。' : '记录体重时可以顺便填体脂率，选填。') + '</div>') +

      '<div class="section-head"><h2>围度</h2><div class="section-head__action"><span>单位 cm</span><button class="add-btn" data-action="add-measure">' + icon('plus') + '记录</button></div></div>' +
      (measures.length ?
        '<div class="metric-grid">' + metrics.map((m, i) =>
          '<div class="metric ' + (i === metrics.length - 1 ? 'metric--wide' : '') + '">' +
            '<div class="metric__label">' + m.name + '</div>' +
            '<div class="metric__val"><b>' + (m.cur ? fmtNum(m.cur[m.key]) : '—') + '</b><small>cm</small></div>' +
            '<div class="metric__delta ' + (m.delta == null ? 'is-flat' : '') + '">' + (m.delta == null ? '首次记录' : '较上次 ' + signed(m.delta, ' cm')) + '</div>' +
            '<div class="metric__date">' + (m.cur ? m.cur.date.replace(/-/g, '.') : '') + '</div>' +
          '</div>'
        ).join('') + '</div>' :
        '<div class="empty"><b>还没有围度记录</b>记下胸腰臀臂腿，和之后的自己对比。</div>') +

      '<div class="section-head"><h2>有氧</h2><div class="section-head__action"><span>本周 ' + cardioWeekMinutes() + ' 分钟</span><button class="add-btn" data-action="add-cardio">' + icon('plus') + '记录</button></div></div>' +
      (cardio.length ?
        '<div class="panel" style="padding:2px 14px">' + cardio.map(c => {
          const bits = [];
          if(c.incline) bits.push('坡度 ' + c.incline + '%');
          if(c.speed) bits.push(c.speed + ' km/h');
          return '<div class="log-row">' +
            '<div class="log-row__main"><div class="log-row__title">' + esc(c.type) + '<span class="mini-tag">有氧</span></div>' +
              '<div class="log-row__sub">' + c.date.replace(/-/g, '.') + (bits.length ? ' · ' + bits.join(' · ') : '') + '</div></div>' +
            '<div class="log-row__val">' + (c.minutes || 0) + ' 分</div>' +
            '<button class="del-btn" data-action="del-cardio" data-id="' + c.id + '" aria-label="删除有氧记录">' + icon('trash') + '</button>' +
          '</div>';
        }).join('') + '</div>' :
        '<div class="empty"><b>还没有有氧记录</b>爬坡走、快走、跑步、单车、椭圆机、划船机都能记。</div>') +

      (S.demo ? '<div class="notice">' + icon('info') + '<span>身体数据里包含生成的示例记录，可在「我的」中清空示例数据。</span></div>' : '') +
    '</div>'
  );
}

/* ===== 07-workout.js ===== */
/* ============================================================
   7. 训练执行（含热身 / 腹部收尾）/ 汇总
   ============================================================ */

function workoutPager(s){
  const warmDone = s.warmup.length && s.warmupDone.length >= s.warmup.length;
  return '<div class="ex-pager">' +
    '<button class="ex-chip ' + (s.phase === 'warmup' ? 'is-on' : '') + ' ' + (warmDone ? 'is-complete' : '') + '" data-action="goto-warmup"><span class="ex-chip__dot"></span>热身</button>' +
    s.exercises.map((e, i) => {
      const rows = s.sets.filter(x => x.exIdx === i);
      const done = rows.length && rows.every(x => x.done);
      return '<button class="ex-chip ' + (s.phase !== 'warmup' && s.currentEx === i ? 'is-on' : '') + ' ' + (done ? 'is-complete' : '') + '" data-action="goto-ex" data-idx="' + i + '"><span class="ex-chip__dot"></span>' + pad(i + 1) + '</button>';
    }).join('') +
  '</div>';
}

function workoutHead(s, isWarm){
  const total = s.sets.length;
  const done = s.sets.filter(x => x.done).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const meta = isWarm ? '热身 · 不计容量' : 'EX ' + pad(s.currentEx + 1) + ' / ' + pad(s.exercises.length) + ' · ' + fmtClock(s.elapsed);
  return '<header class="wk-head">' +
      '<button class="icon-btn" data-action="exit-workout" aria-label="退出训练">' + icon('x') + '</button>' +
      '<div class="wk-head__mid"><div class="wk-head__name">' + s.dayName + '</div><div class="wk-head__meta">' + meta + '</div></div>' +
      '<button class="text-btn" data-action="finish-workout">完成</button>' +
    '</header>' +
    '<div class="progress"><i style="width:' + pct + '%"></i></div>';
}

function plateStack(weight){
  const perSide = Math.max(0, (weight - 20) / 2);
  let left = perSide;
  const used = [];
  PLATES.forEach(p => {
    while(left >= p - 0.001){
      used.push(p);
      left -= p;
    }
  });
  const vis = (arr) => '<div class="plate-stack">' + arr.map(p => '<i class="plate" style="height:' + PLATE_H[p] + 'px"></i>').join('') + '</div>';
  return {used, left, html:
    '<div class="plate-vis">' + vis(used.slice().reverse()) + '<i class="collar"></i><i class="bar-rod"></i><i class="collar"></i>' + vis(used) + '</div>'};
}

function calcHtml(s, exIdx){
  const info = exInfo(s.exercises[exIdx].ex);
  if(info.type !== 'barbell') return '';
  const open = calcFor === exIdx;
  const rows = s.sets.filter(x => x.exIdx === exIdx);
  const w = +((rows.find(r => !r.done) || rows[0] || {}).weight) || 20;
  const stack = plateStack(w);
  return '<div class="calc">' +
    '<button class="calc__toggle" data-action="toggle-calc" data-idx="' + exIdx + '"><span>' + icon('calculator') + '杠铃片计算</span>' +
      icon('chevron-down', 'calc__chev ' + (open ? 'is-open' : '')) + '</button>' +
    (open ? '<div class="calc__panel">' + stack.html +
      '<div class="calc__rows">' +
        '<div class="calc__row"><span>杠铃 + 卡扣</span><b>20 kg</b></div>' +
        '<div class="calc__row"><span>每侧加载</span><b>' + fmtNum((w - 20) / 2) + ' kg</b></div>' +
        '<div class="calc__row"><span>片组合</span><b>' + (stack.used.length ? stack.used.join(' + ') : '空杆') + '</b></div>' +
        (stack.left > 0.01 ? '<div class="calc__row is-warn"><span>无法配平</span><b>差 ' + fmtNum(stack.left) + ' kg</b></div>' : '') +
      '</div><div class="calc__note">按当前重量 ' + fmtNum(w) + ' kg 计算，两侧对称</div></div>' : '') +
  '</div>';
}

function viewWarmup(s){
  const tags = [];
  s.warmup.forEach(w => { if(tags.indexOf(w.tag) < 0) tags.push(w.tag); });
  const checked = s.warmupDone.length;
  const all = checked >= s.warmup.length;
  return '<div class="screen view-anim">' +
    workoutHead(s, true) +
    '<div class="screen__body">' +
      workoutPager(s) +
      '<div class="warm-hero">' +
        '<div class="warm-hero__kicker">WARM UP / 不计入容量</div>' +
        '<div class="warm-hero__title">开练前<br>把身体叫醒</div>' +
        '<div class="warm-hero__sub">今天以' + (tags.indexOf('髋膝踝') >= 0 && tags.indexOf('肩肘') >= 0 ? '全身' : (tags.indexOf('髋膝踝') >= 0 ? '髋 · 膝 · 踝' : (tags.indexOf('肩肘') >= 0 ? '肩 · 肘' : '脊柱'))) + '为主，花 5 分钟活动关节、激活目标肌群。</div>' +
        '<div class="warm-hero__tags">' + tags.map(t => '<span class="tag ' + (t === '全身' ? '' : 'tag--acid') + '">' + t + '</span>').join('') + '</div>' +
      '</div>' +
      '<div class="section-head"><h2>热身清单</h2><span>' + checked + ' / ' + s.warmup.length + ' 已完成</span></div>' +
      '<div class="panel" style="padding:2px 14px">' +
        s.warmup.map((w, i) => {
          const done = s.warmupDone.indexOf(i) >= 0;
          return '<button class="warm-item ' + (done ? 'is-done' : '') + '" data-action="warm-toggle" data-idx="' + i + '">' +
            '<span class="warm-item__num">' + pad(i + 1) + '</span>' +
            '<span class="warm-item__main"><span class="warm-item__name">' + w.name + '<span class="mini-tag">' + w.tag + '</span></span><span class="warm-item__sub">' + w.detail + '</span></span>' +
            '<span class="warm-item__check">' + icon('check') + '</span>' +
          '</button>';
        }).join('') +
      '</div>' +
      '<p class="warm-note">热身的勾选只是打卡，不会写入训练容量或 PR。勾选完可直接开始第一组。</p>' +
    '</div>' +
    '<div class="wk-foot">' +
      '<button class="btn btn--ghost" data-action="skip-warm">跳过</button>' +
      '<button class="btn btn--primary" data-action="start-training">' + (all ? '开始第一组' : '热身完成 · 开始') + icon('arrow-right') + '</button>' +
    '</div>' +
  '</div>';
}

function viewExercise(s){
  const idx = s.currentEx;
  const ex = s.exercises[idx];
  if(!ex) return viewWarmup(s);
  const info = exInfo(ex.ex);
  const rows = s.sets.map((r, i) => ({r, i})).filter(x => x.r.exIdx === idx);
  const doneCount = rows.filter(x => x.r.done).length;
  const last = lastLift(ex.ex);
  const hold = isHold(ex.ex);
  const isLast = idx === s.exercises.length - 1;
  const nextLabel = isLast ? '完成训练' : '下一个';
  const prevText = last ? (last.weight > 0 ? fmtNum(last.weight) + ' × ' + last.reps : '自重 × ' + last.reps) : '首次训练';
  const facts = hold ?
    ['组数', ex.sets, '保持', (ex.repsMax || 45) + 's', '休息', ex.rest + 's'] :
    ['组数', ex.sets, '次数', repsText(ex, ex.ex), '休息', ex.rest + 's'];

  return '<div class="screen view-anim">' +
    workoutHead(s, false) +
    '<div class="screen__body">' +
      workoutPager(s) +
      '<div class="ex-head">' +
        '<div class="ex-kicker">' + (ex.abs ? 'ABS FINISHER / 腹部收尾' : 'WORKING SET / 主训练') + ' · ' + pad(idx + 1) + '</div>' +
        '<h1 class="ex-name">' + esc(ex.ex) + '</h1>' +
        '<div class="ex-sub">' + esc(info.muscle) + '<span class="sep"></span>' + esc(info.equip) + (info.unilateral ? '<span class="sep"></span>单侧' : '') + '</div>' +
      '</div>' +
      '<div class="ex-facts">' +
        '<div class="ex-fact"><b>' + facts[1] + '</b>' + facts[0] + '</div>' +
        '<div class="ex-fact"><b>' + facts[3] + '</b>' + facts[2] + '</div>' +
        '<div class="ex-fact"><b>' + facts[5] + '</b>' + facts[4] + '</div>' +
      '</div>' +
      '<p class="cue">' + esc(info.cue || '保持动作控制，做满全程幅度。') + '</p>' +
      '<div class="prev-bar"><span>上次</span><b>' + prevText + '</b><span style="margin-left:auto">已完成 ' + doneCount + ' / ' + rows.length + '</span></div>' +
      calcHtml(s, idx) +
      '<div class="set-table">' +
        '<div class="set-table__head"><span>组</span><span>重量 KG</span><span>' + (hold ? '秒' : '次数') + '</span><span>上次</span><span></span></div>' +
        rows.map(({r, i}) =>
          '<div class="set-row ' + (r.done ? 'is-done' : '') + '">' +
            '<span class="set-idx">' + (r.setIdx + 1) + '</span>' +
            '<input class="set-input" type="number" inputmode="decimal" step="' + (info.step || 1) + '" min="0" value="' + esc(r.weight) + '" data-set="' + i + '" data-field="weight" aria-label="重量">' +
            '<input class="set-input" type="number" inputmode="numeric" step="1" min="1" value="' + esc(r.reps) + '" data-set="' + i + '" data-field="reps" aria-label="' + (hold ? '秒' : '次数') + '">' +
            '<span class="set-prev">' + (info.bw ? '自重' : (last ? fmtNum(last.weight) : '—')) + '<br>' + (last ? last.reps : '') + '</span>' +
            '<button class="set-check" data-action="toggle-set" data-row="' + i + '" aria-label="完成第 ' + (r.setIdx + 1) + ' 组">' + icon('check') + '</button>' +
          '</div>'
        ).join('') +
      '</div>' +
      '<div class="set-tools">' +
        '<button class="mini-btn" data-action="copy-first" data-idx="' + idx + '">' + icon('copy') + '复制首组到未完成组</button>' +
        '<span class="tool-hint">勾选后自动计时<br>' + ex.rest + ' 秒休息</span>' +
      '</div>' +
    '</div>' +
    '<div class="wk-foot">' +
      '<button class="btn btn--ghost" data-action="prev-ex" ' + (idx === 0 ? 'disabled style="opacity:.35"' : '') + '>上一项</button>' +

function restOverlay(s){
  if(!s.rest) return '';
  const left = Math.max(0, s.rest.until - Date.now());
  const pct = Math.min(100, Math.max(0, left / s.rest.total * 100));
  return '<div class="rest" id="rest-panel">' +
    '<div class="rest__top"><span class="rest__label">' + icon('timer') + '组间休息</span><span class="rest__next">下一组 · ' + esc(s.rest.next || '') + '</span></div>' +
    '<div class="rest__mid"><span class="rest__time" id="rest-time">' + fmtMs(left) + '</span><span class="rest__unit">剩余</span></div>' +
    '<div class="rest__bar"><i id="rest-bar" style="width:' + pct + '%"></i></div>' +
    '<div class="rest__actions">' +
      '<button class="mini-btn" data-action="rest-minus">-15 秒</button>' +
      '<button class="mini-btn" data-action="rest-plus">+15 秒</button>' +
      '<button class="rest__skip" data-action="rest-skip">跳过休息</button>' +
    '</div>' +
  '</div>';
}

function startGenerate(){
  const ob = S.onboard;
  if(!ob.goal || !ob.freq || !ob.template) return;
  const gen = $('#gen');
  const msg = $('#gen-msg');
  const steps = ['读取动作库…', '排入热身与腹部收尾…', '生成本周训练日…'];
  gen.hidden = false;
  let i = 0;
  if(msg) msg.textContent = steps[0];
  const timer = setInterval(() => {
    i++;
    if(msg && steps[i]) msg.textContent = steps[i];
  }, 360);
  setTimeout(() => {
    clearInterval(timer);
    S.plan = buildPlan(ob.template, ob.goal, ob.freq);
    S.prs = {};
    Object.keys(EX_LIB).forEach(n => { if(EX_LIB[n].pr) S.prs[n] = EX_LIB[n].pr; });
    seedDemo(S.plan);
    S.view = 'main';
    S.ui.tab = 'today';
    S.selectedDay = 0;
    NAV = {tab:'today', stack:[]};
    save();
    gen.hidden = true;
    render();
    toast('计划已生成 · 可在「计划」里调整动作与组次');
  }, 900);
}

function toast(msg, ms){
  const root = $('#toast-root');
  if(!root) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .25s,transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(-6px)';
    setTimeout(() => el.remove(), 260);
  }, ms || 2400);
}

/* 我的页：点击称呼就地改名 */
function startNameEdit(){
  const el = document.querySelector('.me-name');
  if(!el || el.querySelector('input')) return;
  const old = S.profile.name;
  const input = document.createElement('input');
  input.className = 'me-name-input';
  input.type = 'text';
  input.maxLength = 12;
  input.value = old;
  input.setAttribute('aria-label', '训练者名称');
  el.textContent = '';
  el.appendChild(input);
  input.focus();
  input.select();
  let done = false;
  const commit = () => {
    if(done) return;
    done = true;
    const v = input.value.trim();
    if(v && v !== old){ S.profile.name = v; save(); }
    el.textContent = S.profile.name;
  };
  const cancel = () => {
    if(done) return;
    done = true;
    el.textContent = old;
  };
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); input.blur(); }
    else if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
  });
  input.addEventListener('blur', () => { if(!done) commit(); });
}

  NAV = {tab, stack:[]};
  save();
  render();
}
function push(name, data){
  NAV.stack.push(Object.assign({name}, data || {}));
  render();
}
function pop(){
  NAV.stack.pop();
  render({keep:true});
}
function getScroll(){
  const b = $('.screen__body');
  return b ? b.scrollTop : 0;
}
function render(opts){
  const keep = !!(opts && opts.keep);
  const prev = keep ? getScroll() : 0;
  const app = $('#app');
  if(!app) return;
  let html;
  if(!S.plan) html = viewOnboarding();
  else if(S.view === 'onboarding') html = viewOnboarding();
  else if(S.view === 'workout') html = viewWorkout();
  else if(S.view === 'summary') html = viewSummary();
  else html = currentMain();
  app.innerHTML = html;
  if(keep){
    requestAnimationFrame(() => {
      const b = $('.screen__body');
      if(b) b.scrollTop = prev;
    });
  }
  renderSheet();
  const mr = $('#modal-root');
  if(mr && !MODAL){ mr.classList.remove('is-open'); mr.innerHTML = ''; }
}

function currentMain(){
  const sub = topOfStack();
  if(sub){
    if(sub.name === 'planDay') return viewPlanDay(sub.dayId);
    if(sub.name === 'planEdit') return viewPlanEdit(sub.dayId);
    if(sub.name === 'picker') return viewPicker(sub.dayId);
    if(sub.name === 'library') return viewLibrary();
    if(sub.name === 'customEx') return viewCustomEx();
    if(sub.name === 'templates') return viewTemplates();
    if(sub.name === 'template') return viewTemplateDetail(sub.id);
    if(sub.name === 'tplEdit') return viewTplEdit();
    if(sub.name === 'tplpicker') return viewTplPicker(sub.dayId);
  }
  if(S.ui.tab === 'plan') return viewPlan();
  if(S.ui.tab === 'progress') return viewProgress();
  if(S.ui.tab === 'body') return viewBody();
  if(S.ui.tab === 'me') return viewMe();
  return viewToday();
}

function finishNow(){
  if(!S.session) return;
  const sum = buildSummary();
  S.history.unshift(sum);
  S.lastSummary = sum;
  S.session = null;
  S.selectedDay = 0;
  S.view = 'summary';
  save();
  render();
}

function requestFinish(){
  if(!S.session) return;
  const done = S.session.sets.filter(x => x.done).length;
  if(!done){ toast('还没有勾选完成的组'); return; }
  openConfirm({
    title: '完成本次训练？',
    desc: '已勾选 <b style="color:var(--text)">' + done + '</b> 组，将写入本机训练历史并结算 PR。热身不计入容量。',
    okText: '完成训练',
    onOk: finishNow
  });
}

function startRest(row){
  const s = S.session;
  const idx = s.sets.indexOf(row);
  const next = s.sets.slice(idx + 1).find(x => !x.done);
  const ex = s.exercises[row.exIdx];
  s.rest = {
    until: Date.now() + ex.rest * 1000,
    total: ex.rest * 1000,
    next: next ? (next.ex === row.ex ? '第 ' + (next.setIdx + 1) + ' 组 · ' + next.ex : next.ex) : '最后一个动作完成'
  };
}

function refreshResults(){
  const box = $('#lib-results');
  const top = topOfStack();
  if(!box || !top) return;
  const mode = top.name === 'picker' ? 'pick' : (top.name === 'tplpicker' ? 'tplpick' : 'browse');
  box.innerHTML = libResultsHtml(mode, top.dayId);
}

function addExercise(dayId, name){
  const day = getDayById(S.plan, dayId);
  if(!day) return false;
  if(day.exercises.some(e => e.ex === name)){ toast('这个动作已经在训练日里'); return false; }
  const info = exInfo(name);
  let cfg;
  if(info.hold) cfg = {ex:name, sets:3, repsMin:45, repsMax:45, rest:60};
  else if(info.pattern === '核心') cfg = {ex:name, sets:3, repsMin:12, repsMax:15, rest:60};
  else cfg = {ex:name, sets:3, repsMin:8, repsMax:12, rest:90};
  day.exercises.push(cfg);
  save();
  return true;
}

function doCopyTemplate(id){
  const tpl = customTemplateById(id) || TEMPLATES.find(t => t.id === id);
  if(!tpl) return;
  const goal = S.plan ? S.plan.goal : (S.onboard.goal || 'muscle');
  const freq = S.plan ? S.plan.freq : (S.onboard.freq || 3);
  const start = S.plan ? S.plan.startDate : todayISO();
  S.plan = buildPlan(tpl, goal, freq, start);
  S.session = null;
  S.selectedDay = 0;
  S.view = 'main';
  S.ui.tab = 'plan';
  NAV = {tab:'plan', stack:[{name:'planDay', dayId:S.plan.days[0].id}]};
  save();
  render();
  toast('已复制「' + tpl.name + '」，可以开始调整');
}

/* ---------- 自定义模板 ---------- */
function startNewTemplate(){
  TPL_DRAFT = {id:uid('tpl'), name:'', days:[emptyTplDay(1)]};
  libQuery = '';
  NAV.stack.push({name:'tplEdit'});
  render();
}
function startEditTemplate(id){
  const t = customTemplateById(id);
  if(!t) return;
  TPL_DRAFT = JSON.parse(JSON.stringify(t));
  libQuery = '';
  NAV.stack.push({name:'tplEdit'});
  render();
}
function syncTplDraft(){
  if(!TPL_DRAFT) return;
  const nameEl = $('#tpl-name');
  if(nameEl) TPL_DRAFT.name = nameEl.value;
  $$('.tpl-day-name').forEach(el => {
    const day = tplDraftDay(el.dataset.dayId);
    if(day) day.name = el.value;
  });
}
function addTplExercise(dayId, name){
  const day = tplDraftDay(dayId);
  if(!day) return false;
  if(day.exercises.some(e => e.ex === name)){ toast('这个动作已经在训练日里'); return false; }
  const info = exInfo(name);
  let cfg;
  if(info.hold) cfg = {ex:name, sets:3, repsMin:45, repsMax:45, rest:60};
  else if(info.pattern === '核心') cfg = {ex:name, sets:3, repsMin:12, repsMax:15, rest:60};
  else cfg = {ex:name, sets:3, repsMin:8, repsMax:12, rest:90};
  day.exercises.push(cfg);
  return true;
}
function saveTplDraft(){
  if(!TPL_DRAFT) return;
  syncTplDraft();
  const name = (TPL_DRAFT.name || '').trim();
  if(!name){ toast('请填写模板名称'); return; }
  if(!TPL_DRAFT.days.length){ toast('至少添加一个训练日'); return; }
  for(let i=0;i<TPL_DRAFT.days.length;i++){
    const day = TPL_DRAFT.days[i];
    day.name = (day.name || '').trim() || ('Day ' + (i + 1));
    if(!day.exercises.length){ toast('「' + day.name + '」至少添加一个动作'); return; }
  }
  TPL_DRAFT.name = name;
  const clean = JSON.parse(JSON.stringify(TPL_DRAFT));
  const idx = S.templates.findIndex(t => t.id === clean.id);
  if(idx >= 0) S.templates[idx] = clean;
  else S.templates.push(clean);
  save();
  TPL_DRAFT = null;
  NAV.stack = [{name:'templates'}];
  render();
  toast('模板已保存');
}

function syncCustomDraft(){
  const el = $('#custom-name');
  if(el) CUSTOM_DRAFT.name = el.value;
}

/* ---------- 动作分发 ---------- */
function handleAction(a, el){
  const ds = el.dataset;
  switch(a){
    case 'go-tab': goTab(ds.tab); break;
    case 'back': pop(); break;

    /* 引导 */
    case 'ob-goal': S.onboard.goal = ds.value; save(); render({keep:true}); break;
    case 'ob-freq': S.onboard.freq = +ds.value; save(); render({keep:true}); break;
    case 'ob-template': S.onboard.template = ds.value; save(); render({keep:true}); break;
    case 'ob-back': S.onboard.step = Math.max(1, (S.onboard.step || 1) - 1); save(); render(); break;
    case 'ob-next': S.onboard.step = Math.min(3, (S.onboard.step || 1) + 1); save(); render(); break;
    case 'ob-generate': startGenerate(); break;

    /* 今天 / 训练 */
    case 'select-day': S.selectedDay = Math.min(6, +ds.day || 0); save(); render({keep:true}); break;
    case 'start': {
      const entry = S.plan.schedule[0];
      if(!entry || entry.type !== 'train') return;
      S.session = makeSession(entry);
      S.view = 'workout';
      calcFor = -1;
      save();
      render();
      break;
    }
    case 'resume':
      if(!S.session) return;
      S.view = 'workout';
      save();
      render();
      break;
    case 'exit-workout':
      openConfirm({
        title: '退出训练？',
        desc: '已勾选的组会保留为草稿，回到「今天」可以继续。',
        okText: '保存并退出',
        onOk: () => {
          S.view = 'main'; S.ui.tab = 'today'; NAV = {tab:'today', stack:[]};
          save(); render();
        }
      });
      break;
    case 'finish-workout': requestFinish(); break;
    case 'warm-toggle': {
      const i = +ds.idx;
      if(!S.session) return;
      const at = S.session.warmupDone.indexOf(i);
      if(at >= 0) S.session.warmupDone.splice(at, 1);
      else S.session.warmupDone.push(i);
      save();
      render({keep:true});
      break;
    }
    case 'start-training':
    case 'skip-warm':
      if(!S.session) return;
      S.session.phase = 'train';
      S.session.currentEx = 0;
      S.session.rest = null;
      calcFor = -1;
      save();
      render();
      break;
    case 'goto-warmup':
      if(!S.session) return;
      S.session.phase = 'warmup';
      S.session.rest = null;
      save();
      render();
      break;
    case 'goto-ex':
      if(!S.session) return;
      S.session.phase = 'train';
      S.session.currentEx = +ds.idx;
      S.session.rest = null;
      calcFor = -1;
      save();
      render();
      break;
    case 'toggle-calc': calcFor = calcFor === +ds.idx ? -1 : +ds.idx; render({keep:true}); break;
    case 'toggle-set': {
      const s = S.session;
      if(!s) return;
      const row = s.sets[+ds.row];
      if(!row) return;
      const info = exInfo(row.ex);
      const w = parseFloat(row.weight), reps = parseFloat(row.reps);
      if(!(reps > 0)){ toast(info.hold ? '请填写保持秒数' : '请填写次数'); return; }
      if(!info.bw && !(w > 0)){ toast('请填写重量'); return; }
      row.done = !row.done;
      row.weight = String(w > 0 ? w : 0);
      row.reps = String(reps);
      if(row.done) startRest(row);
      save();
      render({keep:true});
      break;
    }
    case 'copy-first': {
      const s = S.session;
      if(!s) return;
      const rows = s.sets.filter(x => x.exIdx === +ds.idx);
      if(!rows.length) return;
      rows.filter(x => !x.done).forEach(x => { x.weight = rows[0].weight; x.reps = rows[0].reps; });
      save();
      render({keep:true});
      toast('已复制首组的重量与次数');
      break;
    }
    case 'prev-ex':
      if(!S.session) return;
      S.session.currentEx = Math.max(0, S.session.currentEx - 1);
      S.session.rest = null;
      calcFor = -1;
      save();
      render();
      break;
    case 'next-ex': {
      const s = S.session;
      if(!s) return;
      if(s.currentEx >= s.exercises.length - 1){ requestFinish(); return; }
      s.currentEx++;
      s.rest = null;
      calcFor = -1;
      save();
      render();
      break;
    }
    case 'rest-skip':
      if(S.session){ S.session.rest = null; save(); render({keep:true}); }
      break;
    case 'rest-minus':
    case 'rest-plus': {
      const s = S.session;
      if(!s || !s.rest) return;
      const delta = a === 'rest-plus' ? 15000 : -15000;
      s.rest.until += delta;
      s.rest.total = Math.max(5000, s.rest.total + delta);
      if(s.rest.until <= Date.now()) s.rest = null;
      save();
      render({keep:true});
      break;
    }
    case 'view-summary': {
      const h = S.history.find(x => x.date === todayISO()) || S.history[0];
      if(!h) return;
      S.lastSummary = h;
      S.view = 'summary';
      save();
      render();
      break;
    }
    case 'go-home':
      S.view = 'main';
      S.ui.tab = 'today';
      NAV = {tab:'today', stack:[]};
      S.selectedDay = 0;
      save();
      render();
      break;

    /* 计划 */
    case 'open-plan-day': push('planDay', {dayId:ds.dayId}); break;
    case 'select-plan-day': {
      const top = topOfStack();
      if(top) top.dayId = ds.dayId;
      render({keep:true});
      break;
    }
    case 'edit-day': push('planEdit', {dayId:ds.dayId}); break;
    case 'plan-edit-done': {
      const top = topOfStack();
      if(top && (top.name === 'picker' || top.name === 'planEdit')) NAV.stack.pop();
      else { NAV.stack = []; S.ui.tab = 'plan'; }
      render({keep:true});
      break;
    }
    case 'open-picker': libQuery = ''; push('picker', {dayId:ds.dayId}); break;
    case 'config-ex': {
      const top = topOfStack();
      if(top) openSheet('ex-config', {dayId:top.dayId, idx:+ds.idx});
      break;
    }
    case 'picker-add':
      if(addExercise(ds.dayId, ds.ex)){ refreshResults(); toast('已加入训练日'); }
      break;

    /* 动作库 / 自定义 */
    case 'open-library': libQuery = ''; push('library'); break;
    case 'lib-group': S.ui.libGroup = ds.value; save(); render({keep:true}); break;
    case 'lib-equip': S.ui.libEquip = ds.value; save(); render({keep:true}); break;
    case 'lib-info': openSheet('ex-info', {name:ds.ex}); break;
    case 'new-custom':
      CUSTOM_DRAFT = {name:'', group:'胸', equip:'哑铃', unilateral:false};
      push('customEx');
      break;
    case 'custom-group': syncCustomDraft(); CUSTOM_DRAFT.group = ds.value; save(); render({keep:true}); break;
    case 'custom-equip': syncCustomDraft(); CUSTOM_DRAFT.equip = ds.value; save(); render({keep:true}); break;
    case 'custom-unilateral':
      syncCustomDraft();
      CUSTOM_DRAFT.unilateral = !CUSTOM_DRAFT.unilateral;
      save();
      render({keep:true});
      break;
    case 'custom-save': {
      syncCustomDraft();
      const name = (CUSTOM_DRAFT.name || '').trim();
      if(!name){ toast('请填写动作名称'); return; }
      if(name.length > 20){ toast('动作名称最多 20 个字'); return; }
      if(allExNames().some(n => n.toLowerCase() === name.toLowerCase())){ toast('动作库里已经有同名动作'); return; }
      S.customEx.push({name, group:CUSTOM_DRAFT.group, equip:CUSTOM_DRAFT.equip, unilateral:CUSTOM_DRAFT.unilateral});
      save();
      NAV.stack.pop();
      CUSTOM_DRAFT = {name:'', group:'胸', equip:'哑铃', unilateral:false};
      toast('自定义动作已保存');
      render({keep:true});
      break;
    }

    /* 模板 */
    case 'open-templates': push('templates'); break;
    case 'open-template': push('template', {id:ds.id}); break;
    case 'open-my-template': push('template', {id:ds.id}); break;
    case 'new-template': startNewTemplate(); break;
    case 'tpl-edit': startEditTemplate(ds.id); break;
    case 'tpl-delete': {
      const t = customTemplateById(ds.id);
      if(!t) return;
      openConfirm({
        title: '删除「' + t.name + '」？',
        desc: '只会删除这套自定义模板，已复制出的计划和训练历史不受影响。',
        okText: '删除模板',
        danger: true,
        onOk: () => {
          S.templates = S.templates.filter(x => x.id !== ds.id);
          save();
          NAV.stack = [{name:'templates'}];
          render();
          toast('模板已删除');
        }
      });
      break;
    }
    case 'tpl-add-day':
      if(!TPL_DRAFT) return;
      TPL_DRAFT.days.push(emptyTplDay(TPL_DRAFT.days.length + 1));
      render({keep:true});
      break;
    case 'tpl-del-day': {
      if(!TPL_DRAFT) return;
      if(TPL_DRAFT.days.length <= 1){ toast('至少保留一个训练日'); return; }
      TPL_DRAFT.days = TPL_DRAFT.days.filter(d => d.id !== ds.dayId);
      render({keep:true});
      break;
    }
    case 'tpl-open-picker': libQuery = ''; push('tplpicker', {dayId:ds.dayId}); break;
    case 'tpl-picker-add':
      if(addTplExercise(ds.dayId, ds.ex)){ refreshResults(); toast('已加入训练日'); }
      break;
    case 'tpl-picker-done': NAV.stack.pop(); render({keep:true}); break;
    case 'tpl-config-ex': openSheet('ex-config', {tpl:true, dayId:ds.dayId, idx:+ds.idx}); break;
    case 'tpl-del-ex': {
      const day = tplDraftDay(ds.dayId);
      if(!day) return;
      day.exercises.splice(+ds.idx, 1);
      render({keep:true});
      toast('动作已删除');
      break;
    }
    case 'tpl-save': saveTplDraft(); break;
    case 'copy-template': {
      const t = customTemplateById(ds.id) || TEMPLATES.find(x => x.id === ds.id);
      if(!t) return;
      openConfirm({
        title: '复制「' + t.name + '」？',
        desc: '当前训练日安排会被模板替换，训练历史、PR 和身体数据都会保留。' + (S.session ? '<br><b style="color:#FFB18F">未完成的训练草稿会被放弃。</b>' : ''),
        okText: '复制模板',
        onOk: () => doCopyTemplate(ds.id)
      });
      break;
    }

    /* 进步 */
    case 'range': S.ui.progressRange = ds.value; save(); render({keep:true}); break;
    case 'progress-ex': S.ui.progressEx = ds.ex; save(); render({keep:true}); break;
    case 'pr-all': S.ui.prAll = !S.ui.prAll; save(); render({keep:true}); break;

    /* 身体 */
    case 'edit-name': startNameEdit(); break;
    case 'add-weight': openSheet('add-weight'); break;
    case 'add-measure': openSheet('add-measure'); break;
    case 'add-cardio': openSheet('add-cardio'); break;
    case 'del-weight':
      S.body.weights = S.body.weights.filter(w => w.id !== ds.id);
      save();
      render({keep:true});
      toast('体重记录已删除');
      break;
    case 'del-cardio':
      S.body.cardio = S.body.cardio.filter(c => c.id !== ds.id);
      save();
      render({keep:true});
      toast('有氧记录已删除');
      break;

    /* 我的 */
    case 'clear-demo':
      openConfirm({
        title: '清空示例数据？',
        desc: '会移除生成的训练历史、体重、围度和有氧记录，保留你的计划与自定义动作。',
        okText: '清空示例',
        onOk: () => { clearDemo(); toast('示例数据已清空'); render({keep:true}); }
      });
      break;
    case 'reset':
      openConfirm({
        title: '重置全部数据？',
        desc: '计划、训练历史、PR、身体记录和自定义动作都会被清除，回到初次引导。该操作不可撤销。',
        okText: '确认重置',
        danger: true,
        onOk: () => {
          try{ localStorage.removeItem(KEY); localStorage.removeItem(LEGACY_KEY); }catch(e){}
          S = defaultState();
          NAV = {tab:'today', stack:[]};
          SHEET = null;
          closeModal();
          render();
          toast('已恢复初始状态');
        }
      });
      break;

    /* 面板与弹窗 */
    case 'sheet-close':
      closeSheet();
      render({keep:true});
      break;
    case 'sheet-step': {
      if(!SHEET || SHEET.kind !== 'ex-config') return;
      const day = SHEET.ctx.tpl ? tplDraftDay(SHEET.ctx.dayId) : getDayById(S.plan, SHEET.ctx.dayId);
      const e = day && day.exercises[SHEET.ctx.idx];
      if(!e) return;
      const f = ds.field, d = +ds.dir;
      const hold = isHold(e.ex);
      if(f === 'sets') e.sets = Math.max(1, Math.min(10, e.sets + d));
      else if(f === 'repsMin') e.repsMin = Math.max(1, Math.min(e.repsMax, e.repsMin + d));
      else if(f === 'repsMax'){
        if(hold){
          const v = Math.max(15, Math.min(120, (e.repsMax || 45) + d * 5));
          e.repsMin = v; e.repsMax = v;
        }else{
          e.repsMax = Math.max(e.repsMin, Math.min(30, e.repsMax + d));
        }
      }else if(f === 'rest') e.rest = Math.max(15, Math.min(300, e.rest + d * 15));
      if(!SHEET.ctx.tpl) save();
      renderSheet();
      break;
    }
    case 'sheet-del-ex': {
      if(!SHEET) return;
      const day = SHEET.ctx.tpl ? tplDraftDay(SHEET.ctx.dayId) : getDayById(S.plan, SHEET.ctx.dayId);
      if(!day) return;
      if(!SHEET.ctx.tpl && day.exercises.length <= 1){ toast('每个训练日至少保留一个动作'); return; }
      day.exercises.splice(SHEET.ctx.idx, 1);
      if(!SHEET.ctx.tpl) save();
      closeSheet();
      render({keep:true});
      toast('动作已从训练日移除');
      break;
    }
    case 'sheet-type': {
      if(!SHEET) return;
      SHEET.data.type = ds.value;
      $$('[data-action="sheet-type"]').forEach(b => b.classList.toggle('is-on', b.dataset.value === ds.value));
      const inc = $('#sheet-incline');
      if(inc) inc.placeholder = CARDIO_NO_INCLINE.indexOf(ds.value) >= 0 ? '可留空' : '6';
      break;
    }
    case 'sheet-save': {
      if(!SHEET) return;
      const kind = SHEET.kind;
      if(kind === 'add-weight'){
        const date = ($('#sheet-date') || {}).value || todayISO();
        const kgRaw = (($('#sheet-kg') || {}).value || '').trim();
        const bfRaw = (($('#sheet-bf') || {}).value || '').trim();
        if(!kgRaw && !bfRaw){ toast('请至少填写体重或体脂率'); return; }
        const kg = parseFloat(kgRaw);
        const bf = parseFloat(bfRaw);
        if(kgRaw && !(kg >= 20 && kg <= 300)){ toast('请输入 20-300 kg 之间的体重'); return; }
        if(bfRaw && !(bf >= 3 && bf <= 60)){ toast('请输入 3-60% 之间的体脂率'); return; }
        const patch = {};
        if(kgRaw) patch.kg = Math.round(kg * 10) / 10;
        if(bfRaw) patch.bf = Math.round(bf * 10) / 10;
        const same = S.body.weights.find(w => w.date === date);
        if(same) Object.assign(same, patch);
        else S.body.weights.push(Object.assign({id:uid('w'), date, kg:0}, patch));
        save();
        closeSheet();
        render({keep:true});
        toast(same ? '当天记录已更新' : '记录已保存');
      }else if(kind === 'add-measure'){
        const date = ($('#sheet-date') || {}).value || todayISO();
        const vals = {};
        let any = false;
        MEASURES.forEach(m => {
          const v = parseFloat(($('#sheet-' + m.key) || {}).value);
          if(v >= 10 && v <= 200){ vals[m.key] = Math.round(v * 10) / 10; any = true; }
        });
        if(!any){ toast('至少填写一项围度'); return; }
        const same = S.body.measures.find(m => m.date === date);
        if(same) Object.assign(same, vals);
        else S.body.measures.push(Object.assign({id:uid('m'), date}, vals));
        save();
        closeSheet();
        render({keep:true});
        toast(same ? '当天围度已合并' : '围度已记录');
      }else if(kind === 'add-cardio'){
        const date = ($('#sheet-date') || {}).value || todayISO();
        const minutes = parseFloat(($('#sheet-minutes') || {}).value);
        if(!(minutes > 0)){ toast('请填写有氧时长'); return; }
        if(minutes > 300){ toast('单次时长请不超过 300 分钟'); return; }
        const inclineRaw = ($('#sheet-incline') || {}).value;
        const speedRaw = ($('#sheet-speed') || {}).value;
        const type = SHEET.data.type || CARDIO_TYPES[0];
        const incline = inclineRaw === '' ? null : Math.max(0, Math.min(40, parseFloat(inclineRaw)));
        const speed = speedRaw === '' ? null : Math.max(0, Math.min(40, parseFloat(speedRaw)));
        S.body.cardio.push({id:uid('c'), date, type, minutes, incline, speed});
        save();
        closeSheet();
        render({keep:true});
        toast('有氧已记录');
      }
      break;
    }
    case 'modal-close': closeModal(); break;
    case 'modal-ok': {
      const fn = MODAL && MODAL.onOk;
      closeModal();
      if(typeof fn === 'function') fn();
      break;
    }
  }
}

/* ---------- 输入 ---------- */
function onInput(e){
  const t = e.target;
  if(t.classList && t.classList.contains('set-input')){
    if(!S.session) return;
    const row = S.session.sets[+t.dataset.set];
    if(row){ row[t.dataset.field] = t.value; saveSoon(); }
    return;
  }
  if(t.id === 'lib-search'){
    libQuery = t.value;
    refreshResults();
    return;
  }
  if(t.id === 'custom-name'){ CUSTOM_DRAFT.name = t.value; }
  if(t.id === 'tpl-name' && TPL_DRAFT){ TPL_DRAFT.name = t.value; }
  if(t.classList && t.classList.contains('tpl-day-name')){
    const day = tplDraftDay(t.dataset.dayId);
    if(day) day.name = t.value;
  }
}

/* ---------- 定时器 ---------- */
let lastTick = Date.now();
let saveTick = 0;
function tick(){
  const now = Date.now();
  const dt = Math.min(2, (now - lastTick) / 1000);
  lastTick = now;
  if(S.view === 'workout' && S.session){
    S.session.elapsed = (S.session.elapsed || 0) + dt;
    saveTick += dt;
    const meta = $('.wk-head__meta');
    if(meta && S.session.phase !== 'warmup'){
      meta.textContent = 'EX ' + pad(S.session.currentEx + 1) + ' / ' + pad(S.session.exercises.length) + ' · ' + fmtClock(S.session.elapsed);
    }
    if(S.session.rest){
      const left = S.session.rest.until - now;
      if(left <= 0){
        S.session.rest = null;
        save();
        render({keep:true});
      }else{
        const t = $('#rest-time'), bar = $('#rest-bar');
        if(t) t.textContent = fmtMs(left);
        if(bar) bar.style.width = Math.min(100, left / S.session.rest.total * 100) + '%';
      }
    }
    if(saveTick > 4){ saveTick = 0; save(); }
  }
}

/* ---------- 拖动排序（计划编辑） ---------- */
let DRAG = null;

function startDrag(e, handle){
  if(DRAG) return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  const row = handle.closest('[data-drag-row]');
  const list = row && row.closest('[data-drag-list]');
  if(!row || !list) return;
  const rows = Array.prototype.slice.call(list.querySelectorAll('[data-drag-row]'));
  const idx = rows.indexOf(row);
  if(idx < 0) return;
  e.preventDefault();
  const rect = row.getBoundingClientRect();
  DRAG = {
    row, list, rows, idx, newIdx: idx, handle, pointerId: e.pointerId,
    startY: e.clientY, center: rect.top + rect.height / 2,
    rowH: rect.height,
    tops: rows.map(r => r.getBoundingClientRect().top),
    heights: rows.map(r => r.offsetHeight)
  };
  row.classList.add('is-dragging');
  list.classList.add('is-sorting');
  document.body.classList.add('is-drag-sorting');
  row.style.transform = 'translate3d(0,0,0) scale(1.01)';
  try{ handle.setPointerCapture(e.pointerId); }catch(_){}
  document.addEventListener('pointermove', onDragMove, {passive:false});
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);
  window.addEventListener('wheel', blockDragWheel, {passive:false});
}

function blockDragWheel(e){ e.preventDefault(); }

function onDragMove(e){
  if(!DRAG || e.pointerId !== DRAG.pointerId) return;
  e.preventDefault();
  const dy = e.clientY - DRAG.startY;
  DRAG.row.style.transform = 'translate3d(0,' + dy + 'px,0) scale(1.01)';
  const center = DRAG.center + dy;
  let idx = 0;
  DRAG.rows.forEach((r, i) => {
    if(i === DRAG.idx) return;
    if(DRAG.tops[i] + DRAG.heights[i] / 2 < center) idx++;
  });
  DRAG.newIdx = idx;
  DRAG.rows.forEach((r, i) => {
    if(i === DRAG.idx) return;
    let shift = 0;
    if(idx < DRAG.idx && i >= idx && i < DRAG.idx) shift = DRAG.rowH;
    else if(idx > DRAG.idx && i > DRAG.idx && i <= idx) shift = -DRAG.rowH;
    r.style.transform = shift ? 'translate3d(0,' + shift + 'px,0)' : '';
  });
}

function onDragEnd(){
  if(!DRAG) return;
  const d = DRAG;
  DRAG = null;
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);
  window.removeEventListener('wheel', blockDragWheel);
  try{ d.handle.releasePointerCapture(d.pointerId); }catch(_){}
  d.row.classList.remove('is-dragging');
  d.list.classList.remove('is-sorting');
  document.body.classList.remove('is-drag-sorting');
  d.rows.forEach(r => { r.style.transform = ''; });
  if(d.newIdx === d.idx) return;
  const tplDayId = d.list.dataset.tplDayId;
  const day = tplDayId ? tplDraftDay(tplDayId) : getDayById(S.plan, d.list.dataset.dayId);
  if(!day) return;
  const moved = day.exercises.splice(d.idx, 1)[0];
  day.exercises.splice(d.newIdx, 0, moved);
  if(!tplDayId) save();
  render({keep:true});
}

/* ---------- 启动 ---------- */
function boot(){
  S = loadState();
  ensurePlanFresh();
  if(S.plan && S.view === 'onboarding') S.view = 'main';
  if(!S.plan) S.view = 'onboarding';
  if(S.view === 'workout' && !S.session) S.view = 'main';
  if(S.view === 'summary' && !S.lastSummary) S.view = 'main';
  const validTabs = TABS.map(t => t.id);
  if(validTabs.indexOf(S.ui.tab) < 0) S.ui.tab = 'today';
  if(S.session && S.session.date !== todayISO()) S.session = null;
  if(S.view === 'main' && !S.plan) S.view = 'onboarding';
  NAV = {tab:S.ui.tab, stack:[]};
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if(!el) return;
    if(el.tagName !== 'INPUT') e.preventDefault();
    handleAction(el.dataset.action, el);
  });
  document.addEventListener('input', onInput);
  document.addEventListener('pointerdown', e => {
    const handle = e.target.closest && e.target.closest('[data-drag-handle]');
    if(handle) startDrag(e, handle);
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      if(SHEET){ closeSheet(); render({keep:true}); }
      else if(MODAL) closeModal();
    }
  });
  render();
  setInterval(tick, 500);
}

boot();
</script>
